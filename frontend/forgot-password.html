<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>body { background: var(--brand-bg); display:flex; flex-direction:column; min-height:100vh; }
.login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
.login-box { width: 380px; } .login-box .brand-mark { height: 56px; margin-bottom: 14px; } .login-box h1 { color:#fdf7ea; text-align:center; font-size: 20px; }</style>
</head>
<body>
<div class="login-wrap">
<div class="login-box">
  <img class="brand-mark" src="/img/org-logo.png" alt="Organization logo">
  <h1>Reset Your Password</h1>
  <div class="card">
    <form id="form">
      <label>Email</label><input type="email" id="email" required>
      <div style="margin-top:20px"><button class="btn btn-primary" style="width:100%">Send Reset Link</button></div>
    </form>
    <p class="small-muted" id="msg" style="display:none;margin-top:14px">If that email exists, a reset link has been sent.</p>
  </div>
</div>
</div>
<script src="/js/app.js"></script>
<script>api('/orgs/resolve').then(({ org }) => applyOrgTheme(org)).catch(() => {});</script>
<script>renderPublicFooter();</script>
<script>
qs('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await api('/auth/forgot-password', { method: 'POST', body: { email: qs('#email').value } });
  qs('#form').style.display = 'none';
  qs('#msg').style.display = 'block';
});
</script>
</body>
</html>
