<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>body { background: var(--brand-bg); display:flex; flex-direction:column; min-height:100vh; }
.login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
.login-box { width: 380px; } .login-box .brand-mark { height: 56px; margin-bottom: 14px; } .login-box h1 { color:#fdf7ea; text-align:center; font-size: 20px; }</style>
</head>
<body>
<div class="login-wrap">
<div class="login-box">
  <img class="brand-mark" src="/img/org-logo.png" alt="Organization logo">
  <h1>Choose a New Password</h1>
  <div class="card">
    <form id="form">
      <label>New Password (min 8 characters)</label><input type="password" id="password" required minlength="8">
      <label>Confirm Password</label><input type="password" id="confirm" required minlength="8">
      <div style="margin-top:20px"><button class="btn btn-primary" style="width:100%" id="btn-update">Update Password</button></div>
    </form>
  </div>
</div>
</div>
<script src="/js/app.js"></script>
<script>api('/orgs/resolve').then(({ org }) => applyOrgTheme(org)).catch(() => {});</script>
<script>renderPublicFooter();</script>
<script>
const token = new URLSearchParams(location.search).get('token');
qs('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (qs('#password').value !== qs('#confirm').value) return toast('Passwords do not match', true);
  const btn = qs('#btn-update');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    const { token: authToken, user, permissions } = await api('/auth/accept-invite', { method: 'POST', body: { token, password: qs('#password').value } });
    Auth.set(authToken, user, permissions);
    toast('Password updated');
    location.href = user.role === 'shul' ? '/shul-portal/dashboard' : (user.role === 'store' ? '/store-portal/dashboard' : '/admin/dashboard');
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
