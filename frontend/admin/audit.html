<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
<style>
  /* Dark, console-style theme for THIS page's content area only (the shared
     header/nav above it stays the normal site theme — every other admin
     page still looks like the rest of the app). Overrides generic
     input/select/.card/.btn rules scoped under #content so nothing here
     leaks onto any other page, which reuses the same class names on the
     normal light background. */
  body { background: #0b0d12; }
  #content { background: #0b0d12; min-height: calc(100vh - 70px); margin: -24px; padding: 28px; color: #dfe3ea; }
  #content h2 { color: #f4f6f9; }
  #content .small-muted { color: #8892a3; }
  #content .card { background: #151922; border: 1px solid #262c39; box-shadow: none; }
  #content input, #content select { background: #10131a; border: 1.5px solid #2a3040; color: #e6e9ef; }
  #content input::placeholder { color: #5c6376; }
  #content input:focus, #content select:focus { border-color: #c9a76a; box-shadow: 0 0 0 3px rgba(201,167,106,.18); }
  #content .btn-outline { border-color: #3a4256; color: #dfe3ea; background: transparent; }
  #content .btn-outline:hover { background: #1c2130; }
  #content .btn-primary { background: #c9a76a; color: #1a1508; border-color: #c9a76a; }
  #content table { color: #dfe3ea; }
  #content th { color: #8892a3; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; border-bottom: 1px solid #262c39; text-align: left; padding: 8px 10px; cursor: pointer; user-select: none; white-space: nowrap; }
  #content th:hover { color: #dfe3ea; }
  #content th.sorted { color: #c9a76a; }
  #content td { border-bottom: 1px solid #1c2130; padding: 9px 10px; vertical-align: top; }
  #content tr.log-row:hover { background: #171b26; cursor: pointer; }
  #content .badge { border: 1px solid transparent; }
  #content .badge-success, #content .badge-active, #content .badge-approved { background: rgba(52,211,153,.15); color: #4ade80; border-color: rgba(74,222,128,.3); }
  #content .badge-failed, #content .badge-danger, #content .badge-rejected { background: rgba(248,113,113,.15); color: #f87171; border-color: rgba(248,113,113,.3); }
  #content .badge-pending, #content .badge-mock, #content .badge-inactive { background: rgba(201,167,106,.15); color: #d9b979; border-color: rgba(201,167,106,.3); }
  #content .tabs-dark { display: flex; gap: 4px; border-bottom: 1px solid #262c39; margin-bottom: 16px; }
  #content .tabs-dark button { background: none; border: none; color: #8892a3; font-weight: 600; font-size: 14px; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
  #content .tabs-dark button.active { color: #f4f6f9; border-bottom-color: #c9a76a; }
  #content .tabs-dark button:hover:not(.active) { color: #dfe3ea; }
  #content .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  #content .filter-row input, #content .filter-row select { width: auto; min-width: 130px; }
  #content .filter-row input#f-search, #content .filter-row input#log-search { min-width: 220px; flex: 1; }
  #content .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  #content .log-detail { background: #0b0d12; border: 1px solid #262c39; border-radius: 6px; padding: 10px 12px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  #content .empty-state { color: #6b7280; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<script src="/js/app.js"></script>
<script>
// Hardcoded to super_admin only — not a grantable permission (see
// routes/audit.js and middleware/permissions.js) — so this is a real role
// check, not a can() lookup that would fail open once 'audit' stopped being
// a permission key at all.
Auth.requireRole('super_admin');
renderShell('/admin/audit', `
  <h2 style="margin:0 0 14px">Logs</h2>
  <div class="tabs-dark">
    <button id="tab-actions" class="active">Recent Actions</button>
    <button id="tab-logs">Logs</button>
  </div>

  <div id="pane-actions">
    <p class="small-muted" style="margin-top:0">Every create/update/approve/reject across the system, who did it, and what changed. Undoing restores exactly the fields that action changed; an undone action shows a Redo button to bring it back.</p>
    <div class="filter-row">
      <input id="f-search" placeholder="Search actions, names, users…">
      <select id="f-entity">
        <option value="">All record types</option>
        <option value="shul">Shuls</option>
        <option value="applicant">Applicants</option>
        <option value="store">Stores</option>
        <option value="card">Cards</option>
        <option value="season">Seasons</option>
        <option value="task">Tasks</option>
        <option value="user">Users</option>
        <option value="mass">Mass actions</option>
      </select>
      <select id="f-hours">
        <option value="24">Last 24 hours</option>
        <option value="48" selected>Last 48 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
        <option value="">All time</option>
      </select>
      <select id="f-sort">
        <option value="desc" selected>Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
    </div>
    <div id="actions-list">Loading…</div>
  </div>

  <div id="pane-logs" hidden>
    <p class="small-muted" style="margin-top:0">Every outbound request this platform made to a third-party API — SMS, email, disccardpromos — with what was sent, what came back, and whether it succeeded. Click a row for the full detail.</p>
    <div class="filter-row">
      <input id="log-search" placeholder="Search endpoint, request, response, error…">
      <select id="log-f-provider">
        <option value="">All providers</option>
        <option value="email">Email</option>
        <option value="sms">SMS</option>
        <option value="disccardpromos">disccardpromos</option>
      </select>
      <select id="log-f-success">
        <option value="">Success or failed</option>
        <option value="1">Success only</option>
        <option value="0">Failed only</option>
      </select>
      <select id="log-f-hours">
        <option value="24">Last 24 hours</option>
        <option value="48" selected>Last 48 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
        <option value="">All time</option>
      </select>
      <select id="log-f-pagesize">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
      </select>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th data-sort="created_at">Time</th>
        <th data-sort="provider">Provider</th>
        <th data-sort="method">Method</th>
        <th data-sort="endpoint">Endpoint</th>
        <th data-sort="status_code">Status</th>
        <th data-sort="duration_ms">Duration</th>
        <th>Related</th>
        <th>User</th>
      </tr></thead>
      <tbody id="logs-tbody"><tr><td colspan="8" class="empty-state">Loading…</td></tr></tbody>
    </table>
    </div>
    <div class="flex-between" style="margin-top:12px">
      <span class="small-muted" id="logs-count"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm btn-outline" id="logs-prev">Prev</button>
        <button class="btn btn-sm btn-outline" id="logs-next">Next</button>
      </div>
    </div>
  </div>
`);

const ENTITY_LABELS = { shul: 'shul', applicant: 'applicant', store: 'store', season: 'season', task: 'task', user: 'user', card: 'card' };
const ACTION_VERBS = { create: 'Created', update: 'Updated', delete: 'Deleted', approve: 'Approved', reject: 'Rejected', undo: 'Reversed a change to', login: 'Signed in', esign: 'Signed', send_contract: 'Sent a contract to', retract_signature: 'Retracted a signature on', resolve_duplicate: 'Resolved a duplicate flag on', impersonate: 'Entered the portal as', 'skip-season': 'Marked "X This Season" for', unskip: 'Undid "X This Season" for' };
// Mass actions (bulk buttons + spreadsheet imports) log one audit_log row
// per click/upload instead of one per affected record — entity_id is null,
// and the record ids/names/counts live in after_json instead of a normal
// before/after diff. Rendered with their own headline/detail below rather
// than forced through headline()/changeList(), which assume a single entity.
const MASS_VERBS = { 'mass-approve': 'Approved', 'mass-approve-undo': 'Restored', 'mass-reject': 'Rejected', 'mass-set-pending': 'Set to pending', 'mass-delete': 'Deleted', 'mass-delete-undo': 'Restored', 'mass-import': 'Imported', 'mass-set-status': 'Updated status for', 'mass-deactivate': 'Deactivated', 'mass-activate': 'Activated', 'mass-reconcile-accounts': 'Linked', 'mass-retry-deactivation': 'Deactivated on disccardpromos', 'mass-provider-audit': 'Verified against disccardpromos', 'mass-clear-phantom-accounts': 'Cleared phantom disccardpromos ids on', 'mass-retry-provider-sync': 'Re-synced to disccardpromos' };
const FIELD_LABELS = {
  approval_status: 'Status', card_amount: 'Card Amount', is_active: 'Active', first_name: 'First Name', last_name: 'Last Name',
  name_en: 'Name', name: 'Name', role: 'Role', phone: 'Phone', slots_allocated: 'Slots', email: 'Email', home_phone: 'Home Phone',
  husband_cell: 'Husband Cell', wife_cell: 'Wife Cell', address: 'Address', city: 'City', state: 'State', zip: 'Zip',
  marital_status: 'Marital Status', num_children: 'Children', home_for_yomtov: 'Home for Yom Tov', comments: 'Comments',
  visibility: 'Visibility', opens_at: 'Opens', closes_at: 'Closes', setup_status: 'Setup Status', manager_name: 'Manager Name',
  manager_phone: 'Manager Phone', manager_email: 'Manager Email', owner_name: 'Owner Name', owner_phone: 'Owner Phone', owner_email: 'Owner Email',
};
// Turns an unmapped snake_case column name into a readable label as a
// fallback, rather than showing the raw db column name.
function fieldLabel(k) { return FIELD_LABELS[k] || k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
const DATE_FIELDS = new Set(['opens_at', 'closes_at']);
function fmtVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'number' && (v === 0 || v === 1) && ['is_active', 'home_for_yomtov'].includes(k)) return v ? 'Yes' : 'No';
  if (DATE_FIELDS.has(k)) return fmtDateTime(v);
  if (k === 'card_amount') return fmtMoney(v);
  return String(v);
}
// Best-effort human name for whichever entity this action touched, so the
// headline reads "Updated shul — Congregation Beth Israel" instead of a
// bare entity type + id.
function entityName(row) {
  let r = row.after || row.before;
  // A hard-delete's before/after carries a full cascade snapshot (see
  // utils/entityDelete.js), not a flat row — {kind, row, ...} — so unwrap
  // to the actual entity row before reading name fields off of it.
  if (r && r.kind && r.row) r = r.row;
  if (!r) return '';
  return r.name_en || r.name || `${r.first_name || ''} ${r.last_name || ''}`.trim() || r.email || '';
}

// One clear headline per action, then (for actions with a real before/after
// diff) a short field-by-field list underneath — one field per line, plain
// labels, formatted values — instead of a single comma-packed "→" dump.
function headline(a) {
  const verb = ACTION_VERBS[a.action] || (a.action.charAt(0).toUpperCase() + a.action.slice(1));
  if (a.action === 'login') return 'Signed in';
  const label = ENTITY_LABELS[a.entity_type] || a.entity_type;
  const name = entityName(a);
  return `${verb} ${label}${name ? ' — ' + esc(name) : ''}`;
}
// Best-effort display name for a full applicant/shul row snapshot (or a raw
// id when nothing better is available, e.g. a record already deleted since).
function dupName(row, fallbackId) {
  if (!row) return fallbackId ? `#${String(fallbackId).slice(0, 8)}` : '(deleted record)';
  return row.name_en || `${row.first_name || ''} ${row.last_name || ''}`.trim() || row.email || `#${String(row.id).slice(0, 8)}`;
}
// Headline + detail for 'resolve_duplicate' and 'merge' — these never go
// through headline()/changeList() above, which assume a flat before/after
// field diff on one record. A resolve/bypass or merge touches several rows
// at once (see services/duplicates.js), so before/after here are either a
// full kind-tagged snapshot (new rows — see restoreDuplicateResolve/
// restoreDuplicateMergeApplicants/restoreDuplicateMergeShuls) or, for
// actions logged before that snapshot existed, a bare post-action summary
// with no per-record detail — handled below by showing whatever IS present
// plus a note that older detail wasn't captured, rather than pretending
// there's nothing to show at all (which is what happened before this).
function isDuplicateAction(a) { return a.action === 'resolve_duplicate' || a.action === 'merge'; }
function duplicateHeadline(a) {
  const label = ENTITY_LABELS[a.entity_type] || a.entity_type;
  const snap = (a.before && a.before.kind) ? a.before : null;
  if (a.action === 'resolve_duplicate') {
    const after = a.after || {};
    const verb = after.status === 'bypassed' ? 'Bypassed' : 'Resolved';
    const aName = snap ? dupName(snap.entityA, after.entity_id) : '';
    const bName = snap ? dupName(snap.entityB, after.matched_entity_id) : '';
    const names = aName || bName ? ` — ${esc(aName)} ↔ ${esc(bName)}` : '';
    return `${verb} a duplicate ${label} flag${names}`;
  }
  const after = a.after || {};
  const memberIds = after.memberIds || [];
  const primaryName = snap ? dupName(snap.membersBefore.find(m => m.id === (snap.primaryId || a.entity_id)), a.entity_id) : `#${String(a.entity_id).slice(0, 8)}`;
  const count = snap ? snap.membersBefore.length : memberIds.length;
  return `Merged ${count || 'multiple'} ${count === 1 ? label : label + 's'} into one — primary ${esc(primaryName)}`;
}
function duplicateDetail(a) {
  const snap = (a.before && a.before.kind) ? a.before : null;
  const after = a.after || {};
  let html = '';
  if (a.action === 'resolve_duplicate') {
    const bits = [];
    if (after.reason) bits.push(`Flagged for: ${esc(after.reason)}`);
    if (after.status) bits.push(`Outcome: ${esc(after.status)}`);
    html += bits.length ? `<div class="small-muted" style="margin-top:6px">${bits.join(' · ')}</div>` : '';
    if (snap) {
      const rows = [snap.entityA, snap.entityB].filter(Boolean);
      if (rows.length) {
        html += `<ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text-muted)">
          ${rows.map(r => `<li><strong style="color:#dfe3ea">${esc(dupName(r))}</strong> — was ${r.is_paused ? 'paused' : 'not paused'}${r.duplicate_status ? `, status "${esc(r.duplicate_status)}"` : ''}, now unpaused</li>`).join('')}
        </ul>`;
      }
    } else {
      html += `<div class="small-muted" style="margin-top:4px;font-style:italic">Record details weren't recorded for this action — it was logged before this level of detail was added.</div>`;
    }
    return html;
  }
  // merge
  if (snap) {
    html += `<ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text-muted)">
      ${snap.membersBefore.map(m => `<li>${m.id === snap.primaryId ? '<strong style="color:#dfe3ea">' + esc(dupName(m)) + ' (kept)</strong>' : esc(dupName(m)) + ' (folded in)'}</li>`).join('')}
    </ul>`;
  } else if (after.memberIds && after.memberIds.length) {
    html += `<div class="small-muted" style="margin-top:6px">${after.memberIds.length} records merged (individual names weren't recorded for this older action)</div>`;
  }
  if (typeof after.applicantsReassigned === 'number' && after.applicantsReassigned > 0) {
    html += `<div class="small-muted" style="margin-top:4px">${after.applicantsReassigned} applicant${after.applicantsReassigned === 1 ? '' : 's'} moved onto the surviving shul</div>`;
  }
  const conflicts = after.accountConflicts || [];
  if (conflicts.length) {
    html += `<div class="small-muted" style="margin-top:4px;color:#f87171">${conflicts.map(c => esc(`${c.secondaryName} (disccardpromos #${c.secondaryAccountId}) already had its own account — not auto-linked, needs manual review`)).join('<br>')}</div>`;
  }
  return html;
}
function changeList(a) {
  if (['create', 'delete', 'login'].includes(a.action)) return '';
  const before = a.before || {}, after = a.after || {};
  const keys = [...new Set([...Object.keys(before), ...Object.keys(after)])].filter(k => JSON.stringify(before[k]) !== JSON.stringify(after[k]));
  if (!keys.length) return '';
  return `<ul style="margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--text-muted)">
    ${keys.map(k => `<li><strong style="color:#dfe3ea">${esc(fieldLabel(k))}:</strong> ${esc(fmtVal(k, before[k]))} <span style="color:#c9a76a">→</span> ${esc(fmtVal(k, after[k]))}</li>`).join('')}
  </ul>`;
}

// One row for an entire bulk action instead of the per-field diff a
// single-entity row gets — there's no one "before" to show, just how many
// records were touched, how many were skipped, and (when the backend sent
// them) which ones by name.
function massHeadline(a) {
  const label = ENTITY_LABELS[a.entity_type] || a.entity_type;
  const after = a.after || {};
  if (a.action === 'mass-import') {
    const created = after.created || 0, updated = after.updated || 0, total = created + updated;
    const plural = total === 1 ? label : label + 's';
    const parts = [];
    if (created) parts.push(`${created} created`);
    if (updated) parts.push(`${updated} updated`);
    return `Imported ${total} ${plural}${parts.length ? ' — ' + parts.join(', ') : ''}`;
  }
  if (a.action === 'mass-import-undo') {
    const deleted = after.deletedCreated || 0, restored = after.restoredUpdated || 0, unrestorable = after.unrestorableUpdated || 0;
    const parts = [];
    if (deleted) parts.push(`${deleted} created ${deleted === 1 ? 'record' : 'records'} deleted`);
    if (restored) parts.push(`${restored} updated ${restored === 1 ? 'record' : 'records'} restored`);
    if (unrestorable) parts.push(`${unrestorable} older ${unrestorable === 1 ? 'update' : 'updates'} couldn't be reverted`);
    return `Reversed an import${parts.length ? ' — ' + parts.join(', ') : ''}`;
  }
  if (a.action === 'mass-deactivate-orphans') return `Deactivated ${after.count || 1} stray disccardpromos customer(s) with no applicant here`;
  if (a.action === 'mass-provider-enforce') return `Made disccardpromos match — ${after.count || 0} approved applicants, disccardpromos active ${after.theirActiveBefore ?? '?'} → ${after.theirActiveAfter ?? '?'}${after.matched ? ' (matched)' : ' (not yet matched)'}`;
  if (a.action === 'mass-recheck-duplicates') return `Rechecked ${after.checked || 0} applicant(s) for duplicates — cleared ${after.cleared || 0}, flagged ${after.flagged || 0} new`;
  const verb = MASS_VERBS[a.action] || (a.action.replace(/^mass-/, '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
  const count = after.count || 0;
  return `${verb} ${count} ${count === 1 ? label : label + 's'}`;
}
function massDetail(a) {
  const after = a.after || {};
  const bits = [];
  if (after.skipped) bits.push(`${after.skipped} skipped`);
  if (after.duplicates) bits.push(`${after.duplicates} flagged as duplicates`);
  if (after.errors) bits.push(`${after.errors} errors`);
  if (after.capReached) bits.push('season cap reached');
  if (after.providerErrors) bits.push(`${after.providerErrors} gift-card provider errors`);
  if (after.zeroAmountSkipped) bits.push(`${after.zeroAmountSkipped} had a $0 card amount, nothing sent to disccardpromos`);
  if (after.emailErrors) bits.push(`${after.emailErrors} email errors`);
  if (after.cardLockErrors) bits.push(`${after.cardLockErrors} card-lock errors`);
  if (after.groupsChecked) bits.push(`${after.groupsChecked} merge groups checked`);
  if (after.conflicts) bits.push(`${after.conflicts} need manual review`);
  if (after.attempted) bits.push(`${after.attempted} attempted`);
  if (after.failed) bits.push(`${after.failed} still failed`);
  if (after.notFound) bits.push(`${after.notFound} not found on disccardpromos`);
  if (after.mock) bits.push(`${after.mock} mock-mode ids`);
  if (after.relinked) bits.push(`${after.relinked} relinked`);
  if (after.providerTotal != null) bits.push(`disccardpromos total ${after.providerTotal}`);
  if (after.orphansOnProvider) bits.push(`${after.orphansOnProvider} on disccardpromos with no applicant here`);
  if (after.created) bits.push(`${after.created} created`);
  if (after.linkedExisting) bits.push(`${after.linkedExisting} linked to existing`);
  if (after.fundsLoaded) bits.push(`${after.fundsLoaded} loaded with funds`);
  let html = bits.length ? `<div class="small-muted" style="margin-top:6px">${esc(bits.join(' · '))}</div>` : '';
  // Real per-applicant reasons for the gift-card provider errors counted
  // above — see routes/applicants.js's mass-approve for why this exists
  // (a bare count alone gave no way to tell "not configured" apart from a
  // genuine disccardpromos rejection).
  const providerErrorDetails = (after.providerErrorDetails || []).filter(Boolean);
  if (providerErrorDetails.length) {
    html += `<div class="small-muted" style="margin-top:4px;color:#f87171">${providerErrorDetails.map(d => esc(d)).join('<br>')}</div>`;
  }
  // Merge groups where a secondary already had its own disccardpromos
  // account before it was ever recognized as a duplicate — see
  // reconcileAccountsForGroup's comment in services/duplicates.js for why
  // these are surfaced instead of silently overwritten.
  const conflictDetails = (after.conflictDetails || []).filter(Boolean);
  if (conflictDetails.length) {
    html += `<div class="small-muted" style="margin-top:4px;color:#f87171">${conflictDetails.map(d => esc(d)).join('<br>')}</div>`;
  }
  // Applicants whose disccardpromos deactivation still failed even on this
  // retry — see routes/applicants.js's POST /retry-deactivation.
  const failureDetails = (after.failureDetails || []).filter(Boolean);
  if (failureDetails.length) {
    html += `<div class="small-muted" style="margin-top:4px;color:#f87171">${failureDetails.map(d => esc(d)).join('<br>')}</div>`;
  }
  const notes = (after.notes || []).filter(Boolean);
  if (notes.length) {
    html += `<div class="small-muted" style="margin-top:4px">${notes.map(d => esc(d)).join('<br>')}</div>`;
  }
  const names = (after.names || []).filter(Boolean);
  if (names.length) {
    const shown = names.slice(0, 15).join(', ');
    html += `<div class="small-muted" style="margin-top:4px">${esc(shown)}${names.length > 15 ? esc(`, +${names.length - 15} more`) : ''}</div>`;
  }
  return html;
}

// ---------------------------------------------------------------------------
// Tab 1: Recent Actions — same data/rendering as before, plus client-side
// search/entity-type filter/sort (the whole time window is already fetched
// in one call, so filtering in place is simpler than round-tripping and
// plenty fast at this scale).
// ---------------------------------------------------------------------------
let actionsCache = [];
async function loadActions() {
  const hours = qs('#f-hours').value;
  qs('#actions-list').innerHTML = '<p class="small-muted">Loading…</p>';
  const { actions } = await api(`/audit/recent?hours=${hours}`);
  actionsCache = actions;
  renderActionsList();
}
function renderActionsList() {
  const term = qs('#f-search').value.trim().toLowerCase();
  const entityFilter = qs('#f-entity').value;
  const sortDir = qs('#f-sort').value;
  let rows = actionsCache.filter(a => {
    if (entityFilter === 'mass' && !a.action.startsWith('mass-')) return false;
    if (entityFilter && entityFilter !== 'mass' && a.entity_type !== entityFilter) return false;
    if (!term) return true;
    // Matches the RENDERED headline text too (e.g. "Merged", "Bypassed a
    // duplicate…"), not just raw field values — those are generated from
    // the row, not stored on it, so a search for what the admin actually
    // sees on screen wouldn't otherwise match anything.
    const isMass = a.action.startsWith('mass-'), isDup = isDuplicateAction(a);
    const renderedHeadline = isDup ? duplicateHeadline(a) : (isMass ? massHeadline(a) : headline(a));
    const hay = [a.action, a.entity_type, a.first_name, a.last_name, a.user_email, entityName(a), renderedHeadline]
      .filter(Boolean).join(' ').replace(/<[^>]+>/g, ' ').toLowerCase();
    return hay.includes(term);
  });
  if (sortDir === 'asc') rows = [...rows].reverse();
  qs('#actions-list').innerHTML = rows.length ? rows.map(a => {
    const isMass = a.action.startsWith('mass-');
    const isDup = isDuplicateAction(a);
    return `<div class="card" style="margin-bottom:8px;padding:14px 16px">
      <div class="flex-between">
        <div>
          <strong>${isDup ? duplicateHeadline(a) : (isMass ? esc(massHeadline(a)) : headline(a))}</strong>${a.undone_at ? ' ' + badge('undone', 'inactive') : ''}
          ${isDup ? duplicateDetail(a) : (isMass ? massDetail(a) : changeList(a))}
          <div class="small-muted" style="margin-top:8px">${a.user_id ? esc((a.first_name||'')+' '+(a.last_name||'')).trim() || esc(a.user_email) : 'System'} · ${fmtDateTime(a.created_at)}</div>
        </div>
        ${a.undoable ? `<button class="btn btn-sm btn-outline" onclick="undoAction('${a.id}', false, '${a.action}')">Undo</button>` : ''}
        ${a.redoable ? `<button class="btn btn-sm btn-outline" onclick="undoAction('${a.undo_entry_id}', true)">Redo</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<p class="empty-state">No actions match.</p>';
}
window.undoAction = async (id, isRedo, action) => {
  // Undoing a mass import is more consequential than a normal single-entity
  // undo — it permanently deletes every record the import created (not a
  // reversible "restore," a real delete) and, when the row has the data for
  // it, restores edited records to their prior values. There's also no
  // Redo afterward (see services/audit.js undoMassImportEntry), so the
  // generic "this restores..." wording undersells what's about to happen.
  const message = action === 'mass-import'
    ? 'Undo this import? Every record it CREATED will be permanently deleted, and any records it UPDATED will be restored to their previous values where possible. This cannot be redone afterward.'
    : action === 'merge'
    ? (isRedo ? 'Redo this merge? Every record in the group is brought back to its merged state.' : 'Undo this merge? Every record in the group is restored to exactly how it was right before the merge — this un-merges the whole group, not just the primary record.')
    : action === 'resolve_duplicate'
    ? (isRedo ? 'Redo this? Both records go back to being paused as an open duplicate flag.' : 'Undo this? Both records return to exactly how they were right before this was resolved — including being paused again as an open duplicate flag.')
    : (isRedo ? 'Redo this action? This brings the change back.' : 'Undo this action? This restores the affected record to how it was right before this change.');
  if (!confirm(message)) return;
  try { await api(`/audit/${id}/undo`, { method: 'POST' }); toast(isRedo ? 'Redone' : 'Undone'); loadActions(); } catch (err) { toast(err.message, true); }
};
qs('#f-hours').addEventListener('change', loadActions);
qs('#f-entity').addEventListener('change', renderActionsList);
qs('#f-sort').addEventListener('change', renderActionsList);
qs('#f-search').addEventListener('input', debounce(renderActionsList, 200));

// ---------------------------------------------------------------------------
// Tab 2: Logs — every outbound call to a third-party API (SMS/email/
// disccardpromos), server-side filtered/sorted/paginated (see GET
// /audit/api-logs and services/apiCallLog.js) since this table can grow much
// larger than Recent Actions' 48h-window default.
// ---------------------------------------------------------------------------
const logsState = { page: 1, sort: 'created_at', dir: 'DESC', expanded: null };
function providerBadgeCls(p) { return p === 'email' ? 'pending' : p === 'sms' ? 'active' : 'mock'; }
async function loadLogs() {
  qs('#logs-tbody').innerHTML = '<tr><td colspan="8" class="empty-state">Loading…</td></tr>';
  const params = new URLSearchParams({
    page: logsState.page, pageSize: qs('#log-f-pagesize').value, sort: logsState.sort, dir: logsState.dir,
  });
  const provider = qs('#log-f-provider').value; if (provider) params.set('provider', provider);
  const success = qs('#log-f-success').value; if (success !== '') params.set('success', success);
  const hours = qs('#log-f-hours').value; if (hours) params.set('hours', hours);
  const search = qs('#log-search').value.trim(); if (search) params.set('search', search);
  const { rows, total, pageSize } = await api(`/audit/api-logs?${params}`);
  renderLogsTable(rows);
  const start = total === 0 ? 0 : (logsState.page - 1) * pageSize + 1;
  const end = Math.min(total, logsState.page * pageSize);
  qs('#logs-count').textContent = total ? `${start}–${end} of ${total}` : 'No calls logged in this window.';
  qs('#logs-prev').disabled = logsState.page <= 1;
  qs('#logs-next').disabled = end >= total;
  qsa('#pane-logs th[data-sort]').forEach(th => th.classList.toggle('sorted', th.dataset.sort === logsState.sort));
}
function renderLogsTable(rows) {
  if (!rows.length) { qs('#logs-tbody').innerHTML = '<tr><td colspan="8" class="empty-state">No calls match.</td></tr>'; return; }
  qs('#logs-tbody').innerHTML = rows.map(r => `
    <tr class="log-row" onclick="toggleLogDetail('${r.id}')">
      <td class="mono">${fmtDateTime(r.created_at)}</td>
      <td>${badge(r.provider, providerBadgeCls(r.provider))}</td>
      <td class="mono">${esc(r.method)}</td>
      <td class="mono">${esc(r.endpoint)}</td>
      <td>${r.success ? badge('success', 'success') : badge('failed', 'failed')}${r.status_code ? ` <span class="small-muted">${r.status_code}</span>` : ''}</td>
      <td class="mono">${r.duration_ms != null ? r.duration_ms + 'ms' : '—'}</td>
      <td class="small-muted">${r.related_entity_type ? esc(r.related_entity_type) + ' ' + esc(String(r.related_entity_id || '').slice(0, 8)) : '—'}</td>
      <td class="small-muted">${r.userName ? esc(r.userName) : '—'}</td>
    </tr>
    <tr id="detail-${r.id}" hidden><td colspan="8">
      <div class="log-detail mono">${[
        r.request_summary ? `Request: ${esc(r.request_summary)}` : null,
        r.response_summary ? `Response: ${esc(r.response_summary)}` : null,
        r.error_message ? `Error: ${esc(r.error_message)}` : null,
      ].filter(Boolean).join('\n\n') || 'No further detail recorded.'}</div>
    </td></tr>
  `).join('');
}
window.toggleLogDetail = (id) => {
  const row = qs(`#detail-${id}`);
  if (!row) return;
  row.hidden = !row.hidden;
};
qs('#log-f-provider').addEventListener('change', () => { logsState.page = 1; loadLogs(); });
qs('#log-f-success').addEventListener('change', () => { logsState.page = 1; loadLogs(); });
qs('#log-f-hours').addEventListener('change', () => { logsState.page = 1; loadLogs(); });
qs('#log-f-pagesize').addEventListener('change', () => { logsState.page = 1; loadLogs(); });
qs('#log-search').addEventListener('input', debounce(() => { logsState.page = 1; loadLogs(); }, 300));
qs('#logs-prev').addEventListener('click', () => { if (logsState.page > 1) { logsState.page--; loadLogs(); } });
qs('#logs-next').addEventListener('click', () => { logsState.page++; loadLogs(); });
qsa('#pane-logs th[data-sort]').forEach(th => th.addEventListener('click', () => {
  const col = th.dataset.sort;
  if (logsState.sort === col) logsState.dir = logsState.dir === 'ASC' ? 'DESC' : 'ASC';
  else { logsState.sort = col; logsState.dir = 'DESC'; }
  loadLogs();
}));

// ---------------------------------------------------------------------------
// Tab switching
// ---------------------------------------------------------------------------
let logsLoadedOnce = false;
function switchTab(tab) {
  qs('#tab-actions').classList.toggle('active', tab === 'actions');
  qs('#tab-logs').classList.toggle('active', tab === 'logs');
  qs('#pane-actions').hidden = tab !== 'actions';
  qs('#pane-logs').hidden = tab !== 'logs';
  if (tab === 'logs' && !logsLoadedOnce) { logsLoadedOnce = true; loadLogs(); }
}
qs('#tab-actions').addEventListener('click', () => switchTab('actions'));
qs('#tab-logs').addEventListener('click', () => switchTab('logs'));

loadActions();
</script>
</body>
</html>
