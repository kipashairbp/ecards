<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards & Transactions · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
renderShell('/admin/cards', `
  <div class="flex-between"><h2>Cards & Transactions</h2><div class="pill-row"><button class="btn btn-outline btn-sm" id="btn-sync-all">Sync All Now</button><button class="btn btn-outline btn-sm" id="btn-reconcile" title="Break down why Total spent may differ from disccardpromos' own number">Reconcile</button><button class="btn btn-outline btn-sm" id="btn-export-cards">Export Cards CSV</button><button class="btn btn-outline btn-sm" id="btn-export-txns">Export Transactions CSV</button></div></div>
  <p class="small-muted">Cards auto-sync with disccardpromos every 15 minutes in the background. Use Sync All Now for an immediate refresh.</p>
  <div id="mock-banner"></div>
  <div class="tabs"><button class="active" id="tab-cards-btn">Cards</button><button id="tab-txns-btn">All Transactions</button><button id="tab-byshul-btn">Spent by Shul</button><button id="tab-bystore-btn">Spent by Store</button></div>
  <div id="panel-cards">
    <div class="toolbar"><input id="f-search" placeholder="Search applicant name or card number…"><select id="f-status"><option value="">All statuses</option><option value="unassigned">Unassigned</option><option value="activated">Activated</option><option value="deactivated">Deactivated</option></select><select id="f-pagesize"><option value="25">25 / page</option><option value="50">50 / page</option><option value="100">100 / page</option><option value="200">200 / page</option></select></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Applicant</th><th>Shul</th><th>Card #</th><th>Status</th><th>Amount</th><th>Activated</th><th></th></tr></thead>
      <tbody id="tbody-cards"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
    <div class="paginator" id="pager-cards"></div>
  </div>
  <div id="panel-txns" style="display:none">
    <div class="toolbar"><select id="f-txn-store"><option value="">All stores</option></select></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Date</th><th>Applicant</th><th>Card #</th><th>Type</th><th>Amount</th><th>Store</th></tr></thead>
      <tbody id="tbody-txns"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
    <div class="paginator" id="pager-txns"></div>
  </div>
  <div id="panel-byshul" style="display:none">
    <p class="small-muted">Money loaded onto each shul's applicants' cards, and how much of it has been spent in stores so far. "Allocated" is every approved applicant's committed card_amount for that shul (same figure the Dashboard's "Total Loaded" sums org-wide) — counted once per applicant regardless of how many card rows they hold, so a replaced card or two cards sharing one disccardpromos account never double-counts them.</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Shul</th><th>Allocated</th><th>Spent</th><th>Remaining</th><th></th></tr></thead>
      <tbody id="tbody-byshul"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-bystore" style="display:none">
    <p class="small-muted">Purchases and refunds recorded against each participating store, from disccardpromos transactions linked to it (Stores &gt; a store's own profile &gt; Linked disccardpromos store name(s)). A store showing 0 here either has no linked disccardpromos vendor name yet, or genuinely no spend synced so far.</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Store</th><th>Transactions</th><th>Purchases</th><th>Refunds</th><th></th></tr></thead>
      <tbody id="tbody-bystore"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
`);

let state = { search:'', status:'', page:1, pageSize:Auth.pageSize('cards') };
let txnPage = 1;
let txnStoreFilter = '';

const cardsTabs = ['cards', 'txns', 'byshul', 'bystore'];
function showCardsTab(name) {
  cardsTabs.forEach(t => { qs('#tab-'+t+'-btn').classList.toggle('active', t === name); qs('#panel-'+t).style.display = t === name ? 'block' : 'none'; });
  if (name === 'txns') loadTxns();
  if (name === 'byshul') loadByShul();
  if (name === 'bystore') loadByStore();
}
qs('#tab-cards-btn').addEventListener('click', () => showCardsTab('cards'));
qs('#tab-txns-btn').addEventListener('click', () => showCardsTab('txns'));
qs('#tab-byshul-btn').addEventListener('click', () => showCardsTab('byshul'));
qs('#tab-bystore-btn').addEventListener('click', () => showCardsTab('bystore'));
qs('#f-txn-store').addEventListener('change', () => { txnStoreFilter = qs('#f-txn-store').value; txnPage = 1; loadTxns(); });
// Populated once, up front, from /cards/by-store (not /stores — this page
// only requires the 'cards' permission, and a narrower admin role might not
// also have 'stores') so the filter dropdown is ready the first time the
// Transactions tab (or a "View Transactions" jump from Spent by Store) is
// opened, not just after that tab's own first load.
api('/cards/by-store').then(({ stores }) => {
  qs('#f-txn-store').insertAdjacentHTML('beforeend', stores.map(s => `<option value="${s.store_id}">${esc(s.store_name)}</option>`).join(''));
}).catch(() => {});
// Jumps to the All Transactions tab pre-filtered to one store — used by the
// "View Transactions" button on each Spent by Store row.
window.viewStoreTransactions = (storeId) => {
  txnStoreFilter = storeId; txnPage = 1;
  showCardsTab('txns');
  qs('#f-txn-store').value = storeId;
};
qs('#btn-export-cards').addEventListener('click', () => downloadAuthed('/cards/export?' + new URLSearchParams({ search: state.search, status: state.status }), 'cards.xlsx'));
qs('#btn-sync-all').addEventListener('click', async () => {
  const btn = qs('#btn-sync-all'); btn.disabled = true; btn.textContent = 'Syncing…';
  try { const r = await api('/cards/sync-all', { method: 'POST' }); toast(`Checked ${r.cardsChecked} card(s), synced ${r.transactionsSynced} new transaction(s)${r.cardsDiscovered ? `, found ${r.cardsDiscovered} card(s) activated directly on disccardpromos` : ''}${r.cardsRemoved ? `, deactivated ${r.cardsRemoved} card(s) removed on disccardpromos` : ''}${r.unattributed ? `, ${r.unattributed} transaction(s) couldn't be matched to a specific card (applicant holds more than one)` : ''}${r.malformed ? `, ${r.malformed} transaction(s) had an unrecognized shape and were skipped (check server logs)` : ''}${r.failed ? `, ${r.failed} applicant(s) could NOT be reached this run (network/rate-limit — re-run to pick them up)` : ''}${r.indexPullsFailed ? `, the bulk customer list pull failed and fell back to a slower per-applicant lookup` : ''}`); loadCards(); }
  catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Sync All Now'; }
});
qs('#btn-export-txns').addEventListener('click', () => downloadAuthed('/cards/transactions/export', 'transactions.xlsx'));
qs('#btn-reconcile').addEventListener('click', async () => {
  try {
    const r = await api('/cards/transactions/reconcile');
    const row = (label, b, note) => `<tr><td>${esc(label)}${note ? `<br><span class="small-muted">${esc(note)}</span>` : ''}</td><td>${b.count}</td><td><strong>${fmtMoney(b.amount)}</strong></td></tr>
      ${b.samples.length ? `<tr><td colspan="3" class="small-muted" style="padding-left:24px">${b.samples.map(s => `${esc(s.date || '')} · ${esc(s.who)} · ${esc(s.store || '')} · ${fmtMoney(Math.abs(s.amount))}`).join('<br>')}</td></tr>` : ''}`;
    const body = `
      <p class="small-muted">Season: <strong>${esc(r.season?.name || 'all')}</strong>${r.season?.start_date ? ` (${esc(r.season.start_date)} → ${esc(r.season.end_date || 'open')})` : ' — no start/end dates set on this season, so the "outside the season window" check is skipped'}. ${r.rowsConsidered} synced transaction(s) considered.</p>
      <table><thead><tr><th>What</th><th>Count</th><th>Amount</th></tr></thead><tbody>
        <tr><td>Purchases (gross)</td><td>${r.purchases.count}</td><td>${fmtMoney(r.purchases.amount)}</td></tr>
        ${row('Refunds / money back (subtracted)', r.refunds)}
        <tr><td><strong>Total spent, net of refunds (what the dashboard shows)</strong></td><td></td><td><strong>${fmtMoney(r.totalSpent)}</strong></td></tr>
        ${row('Real money disccardpromos reported that could NOT be matched to a local card (not counted above at all)', r.unattributed, 'Org-wide, every season — usually an applicant holding more than one card whose transaction mask didn\'t clearly match either one. THIS is the most likely reason our total reads lower than disccardpromos\' own number.')}
        ${row('Purchases dated outside this season\'s window', r.outOfSeasonWindow, 'Older history on the same disccardpromos customer, counted under this season\'s card')}
        ${row('Purchases where disccardpromos sent no disccardPaid (cart total used instead)', r.disccardPaidMissing)}
        ${row('Purchases where cart total differs from what the card paid (difference shown)', r.cartAmountDiffersFromPaid, 'Informational — the total already uses what the card paid')}
        ${row('Likely duplicate copies (same card, moment, store, amount under two provider ids)', r.likelyDuplicates)}
        ${row('Purchases on a card whose applicant was deleted', r.onDeletedApplicant)}
        ${row('Purchases on a deactivated card', r.onDeactivatedCard, 'Still real spend — listed in case disccardpromos excludes closed accounts')}
      </tbody></table>
      <p class="small-muted">Send this screen to Claude with disccardpromos' own number for the season to pin down the exact cause of any difference.</p>`;
    openModal('Reconcile Total Spent', body, '<button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>', { wide: true });
  } catch (err) { toast(err.message, true); }
});

async function loadCards() {
  const params = new URLSearchParams(Object.fromEntries(Object.entries(state).filter(([,v]) => v !== '')));
  try {
    const { cards, total, mockMode } = await api('/cards?' + params);
    if (mockMode) qs('#mock-banner').innerHTML = `<div class="card" style="border-color:var(--warn);margin-bottom:16px"><strong>Mock mode:</strong> disccardpromos.com API keys are not configured yet, so card numbers/transactions are simulated placeholders. Set <code>DISCCARDPROMOS_API_BASE</code> and <code>DISCCARDPROMOS_API_KEY</code> to go live.</div>`;
    qs('#tbody-cards').innerHTML = cards.length ? cards.map(c => `<tr>
        <td>${esc(c.first_name)} ${esc(c.last_name)}</td><td>${esc(c.shul_name||'')}</td><td>${esc(c.card_number_masked||'')}</td>
        <td>${badge(c.status,c.status)}</td><td>${fmtMoney(c.amount)}</td><td>${c.activated_at?fmtDateTime(c.activated_at):''}</td>
        <td><button class="btn btn-sm btn-outline" onclick="openCard('${c.id}')">Manage</button></td>
      </tr>`).join('') : "<tr><td colspan=\"7\" class=\"empty-state\">No cards yet. Assign cards from an approved applicant's profile.</td></tr>";
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    qs('#pager-cards').innerHTML = `<button class="btn btn-sm btn-outline" ${state.page<=1?'disabled':''} onclick="changePage(-1)">Prev</button> Page ${state.page} of ${pages} <button class="btn btn-sm btn-outline" ${state.page>=pages?'disabled':''} onclick="changePage(1)">Next</button>`;
  } catch (err) { toast(err.message, true); }
}
function changePage(d) { state.page += d; loadCards(); }
qs('#f-search').addEventListener('input', debounce(() => { state.search = qs('#f-search').value; state.page=1; loadCards(); }, 350));
qs('#f-status').addEventListener('change', () => { state.status = qs('#f-status').value; state.page=1; loadCards(); });
qs('#f-pagesize').value = state.pageSize;
qs('#f-pagesize').addEventListener('change', () => { state.pageSize = +qs('#f-pagesize').value; state.page = 1; Auth.savePageSize('cards', state.pageSize); loadCards(); });
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function changeTxnPage(d) { txnPage += d; loadTxns(); }
async function loadTxns() {
  try {
    const params = new URLSearchParams({ page: txnPage, ...(txnStoreFilter ? { store_id: txnStoreFilter } : {}) });
    const { transactions, total, pageSize } = await api('/cards/transactions/all?' + params);
    qs('#tbody-txns').innerHTML = transactions.length ? transactions.map(t => `<tr>
        <td>${fmtDateTime(t.occurred_at)}</td><td>${esc(t.first_name||'')} ${esc(t.last_name||'')}</td><td>${esc(t.card_number_masked||'')}</td>
        <td>${badge(t.type,t.type)}</td><td>${fmtMoney(t.amount)}</td><td>${esc(t.store_name||'')}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty-state">No transactions yet.</td></tr>';
    const pages = Math.max(1, Math.ceil(total / (pageSize || 100)));
    qs('#pager-txns').innerHTML = `<button class="btn btn-sm btn-outline" ${txnPage<=1?'disabled':''} onclick="changeTxnPage(-1)">Prev</button> Page ${txnPage} of ${pages} <button class="btn btn-sm btn-outline" ${txnPage>=pages?'disabled':''} onclick="changeTxnPage(1)">Next</button>`;
  } catch (err) { toast(err.message, true); }
}

async function loadByShul() {
  try {
    const { shuls } = await api('/cards/by-shul');
    const rows = shuls.map(s => {
      const pct = s.allocated > 0 ? Math.min(100, Math.round((s.spent / s.allocated) * 100)) : 0;
      return `<tr>
        <td>${esc(s.shul_name)}</td><td>${fmtMoney(s.allocated)}</td><td>${fmtMoney(s.spent)}</td><td>${fmtMoney(s.remaining)}</td>
        <td style="min-width:120px"><div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden"><div style="width:${pct}%;background:var(--brand-gold-dark);height:100%"></div></div><span class="small-muted">${pct}%</span></td>
      </tr>`;
    }).join('');
    // Allocated here is SUM(cards.amount) — a physical card has to exist for
    // a shul's applicant to count, same rule the org-wide "Live Spend"
    // total on the Cards tab uses. An approved applicant with money
    // committed but no card assigned yet won't show here at all, which is
    // why this total can come in lower than the Dashboard's "Total Loaded"
    // (that one sums every approved applicant's committed card_amount,
    // card or no card) — two different, both-correct questions, not a bug.
    const totalAllocated = shuls.reduce((sum, s) => sum + (Number(s.allocated) || 0), 0);
    const totalSpent = shuls.reduce((sum, s) => sum + (Number(s.spent) || 0), 0);
    const totalRemaining = shuls.reduce((sum, s) => sum + (Number(s.remaining) || 0), 0);
    const totalRow = shuls.length ? `<tr style="font-weight:700;border-top:2px solid var(--border)">
        <td>Total (${shuls.length} shul${shuls.length===1?'':'s'})</td><td>${fmtMoney(totalAllocated)}</td><td>${fmtMoney(totalSpent)}</td><td>${fmtMoney(totalRemaining)}</td><td></td>
      </tr>` : '';
    qs('#tbody-byshul').innerHTML = shuls.length ? rows + totalRow : '<tr><td colspan="5" class="empty-state">No cards loaded yet.</td></tr>';
  } catch (err) { toast(err.message, true); }
}

async function loadByStore() {
  try {
    const { stores } = await api('/cards/by-store');
    qs('#tbody-bystore').innerHTML = stores.length ? stores.map(s => `<tr>
        <td>${esc(s.store_name)}</td><td>${s.txn_count}</td><td>${fmtMoney(s.total_purchases)}</td><td>${fmtMoney(s.total_refunds)}</td>
        <td><button class="btn btn-sm btn-outline" onclick="viewStoreTransactions('${s.store_id}')">View Transactions</button></td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty-state">No stores yet.</td></tr>';
  } catch (err) { toast(err.message, true); }
}

async function openCard(id) {
  try {
    const { card, transactions } = await api(`/cards/${id}`);
    const body = `
      <div class="grid-2">
        <div><strong>Applicant</strong><br>${esc(card.first_name)} ${esc(card.last_name)}</div>
        <div><strong>Status</strong><br>${badge(card.status,card.status)}</div>
      </div>
      <div class="divider"></div>
      <div class="grid-2">
        <div><strong>Card Number</strong><br>${esc(card.card_number_masked||'')}</div>
        <div><strong>Amount</strong><br>${fmtMoney(card.amount)}</div>
      </div>
      ${card.status === 'activated' && !card.activation_phone ? `<div class="divider"></div><label>Activation Phone <span class="small-muted">(defaults to the applicant's phone on file — change it if they want to activate with a different number)</span></label><input id="act-phone" placeholder="(555) 555-5555" value="${esc(card.husband_cell || card.wife_cell || card.home_phone || '')}">` : ''}
      <div class="divider"></div>
      <h4>Transaction History</h4>
      ${transactions.length ? `<table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Store</th></tr></thead><tbody>${transactions.map(t=>`<tr><td>${fmtDateTime(t.occurred_at)}</td><td>${badge(t.type,t.type)}</td><td>${fmtMoney(t.amount)}</td><td>${esc(t.store_name||'')}</td></tr>`).join('')}</tbody></table>` : '<p class="small-muted">No transactions synced yet.</p>'}
    `;
    const footer = `
      <button class="btn btn-outline btn-sm" onclick="syncCard('${id}')">Sync Now</button>
      ${card.status === 'activated' && !card.activation_phone ? `<button class="btn btn-primary btn-sm" onclick="activateCard('${id}')">Activate</button>` : ''}
      ${card.status !== 'deactivated' ? `<button class="btn btn-danger btn-sm" onclick="deactivateCard('${id}')">Deactivate Account</button>` : ''}
    `;
    openModal('Card Details', body, footer);
  } catch (err) { toast(err.message, true); }
}
window.syncCard = async (id) => { try { const r = await api(`/cards/${id}/sync`, { method: 'POST' }); toast(`Synced ${r.synced} transaction(s)`); closeModal(); openCard(id); } catch (err) { toast(err.message, true); } };
window.activateCard = async (id) => {
  const phone = qs('#act-phone').value.trim();
  if (!phone) return toast('Enter the phone number to activate with', true);
  try { await api(`/cards/${id}/activate`, { method: 'POST', body: { phone } }); toast('Card activated'); closeModal(); loadCards(); } catch (err) { toast(err.message, true); }
};
// disccardpromos has no per-card lock — deactivating locks the WHOLE
// account this card belongs to (every card that applicant holds), not just
// this one. See routes/cards.js's /:id/deactivate.
window.deactivateCard = async (id) => {
  if (!confirm("Deactivate this applicant's disccardpromos account?\n\nThis locks the ENTIRE account — every card they hold, not just this one — since disccardpromos doesn't support locking a single card. Continue?")) return;
  try {
    await api(`/cards/${id}/deactivate`, { method: 'POST' });
    toast('Account deactivated');
    closeModal(); loadCards();
  } catch (err) { toast(err.message, true); }
};

loadCards();
const preselect = new URLSearchParams(location.search).get('card');
if (preselect) openCard(preselect);
</script>
</body>
</html>
