<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applicants · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
renderShell('/admin/applicants', `
  <div class="list-header">
    <div class="flex-between">
      <h2>Applicants</h2>
      <div class="pill-row">
        <button class="btn btn-outline btn-sm" id="btn-template">Download Import Template</button>
        <button class="btn btn-outline btn-sm" id="btn-import">Mass Upload</button>
        <button class="btn btn-outline btn-sm" id="btn-export">Export Excel</button>
        <button class="btn btn-outline btn-sm" id="f-dupes">Duplicates</button>
        <button class="btn btn-outline btn-sm" id="btn-appeals">Appeals</button>
        <button class="btn btn-outline btn-sm" id="btn-provider-sync">Disccardpromos Sync</button>
        <button class="btn btn-outline btn-sm" id="btn-columns">Customize Columns</button>
        <button class="btn btn-primary btn-sm" id="btn-new">+ Add Applicant</button>
      </div>
    </div>
    <div class="toolbar">
      <input id="f-search" placeholder="Search name, phone, email…">
      <select id="f-status"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="soft_rejected">Soft Reject</option><option value="incomplete">Incomplete</option><option value="draft">Draft</option></select>
      <select id="f-paused"><option value="">Paused: All</option><option value="1">Paused only</option><option value="0">Not paused</option></select>
      <select id="f-marital"><option value="">Any marital status</option><option value="single">Single</option><option value="married">Married</option><option value="widowed">Widowed</option><option value="divorced">Divorced</option></select>
      <select id="f-shul"><option value="">All Shuls</option></select>
      <select id="f-season"></select>
      <div class="amount-filter"><input id="f-amount-min" type="number" min="0" step="1" placeholder="Min $"><span class="small-muted">&ndash;</span><input id="f-amount-max" type="number" min="0" step="1" placeholder="Max $"></div>
      <select id="f-pagesize"><option value="25">25 / page</option><option value="50">50 / page</option><option value="100">100 / page</option><option value="200">200 / page</option></select>
    </div>
  </div>
  <div id="cap-banner"></div>
  <div class="toolbar" style="justify-content:flex-end">
    <select id="mass-action">
      <option value="approve">Approve</option>
      <option value="reject">Reject</option>
      <option value="set-pending">Set to Pending</option>
      <option value="email">Email</option>
      <option value="sms">SMS</option>
      <option value="delete">Delete Permanently</option>
    </select>
    <button class="btn btn-sm btn-primary" id="btn-mass-apply" disabled>Apply to Selected (0)</button>
  </div>
  <div id="live-banner"></div>
  <div id="provider-sync-banner"></div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table id="tbl">
      <thead id="thead"></thead>
      <tbody id="tbody"><tr><td class="empty-state">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="paginator" id="pager"></div>
`);

let state = { search:'', status:'', paused:'', marital_status:'', shul_id:'', season_id:'', provider_sync:'', provider_check:'', amount_min:'', amount_max:'', sort:'created_at', dir:'DESC', page:1, pageSize:Auth.pageSize('applicants') };
let selected = new Set();
// Each row's own last-loaded data, keyed by id — kept around (across pages,
// across reloads) purely so a mass action can tell upfront how many of the
// current selection would be skipped (see massActionSkipNote in app.js)
// without a separate fetch. Only ever needs an id that was actually
// rendered at some point, which checking its box requires anyway.
let selectedMeta = new Map();
// Which target-state each mass action checks for, so the skip-count preview
// can tell an admin "3 of 5 are already approved" before running it instead
// of only after. No entry (delete) = no skip check, same as before this.
const MASS_SKIP_PREDICATES = {
  approve: a => a.approval_status !== 'approved' && !a.is_paused,
  reject: a => a.approval_status !== 'rejected',
  'set-pending': a => a.approval_status !== 'pending',
  email: a => !!a.email,
  sms: a => !!(a.husband_cell || a.wife_cell || a.home_phone),
};

// Every field a column can show, plus how to render it — the checkbox
// (selection) column is always first and never customizable, so it's not
// in this list. Which of these show, and in what order, is per-admin
// (Customize Columns button, saved via attachColumnCustomizer).
function contactLine(a) {
  const method = a.preferred_contact_method || '';
  const num = a.preferred_number === 'husband' ? a.husband_cell : a.preferred_number === 'wife' ? a.wife_cell : a.home_phone;
  return `${esc(method)}${num ? ': ' + esc(num) : ''}${a.email ? '<br>' + esc(a.email) : ''}`;
}
const APPLICANT_COLUMNS = [
  { key: 'external_id', label: 'ID', sort: 'external_id', render: a => `<code>${esc(a.external_id||'')}</code>` },
  { key: 'name', label: 'Name', sort: 'last_name', render: a => `<strong>${esc(a.first_name)} ${esc(a.last_name)}</strong>${a.is_paused ? ' ' + badge('paused','paused') : ''}` },
  { key: 'shul', label: 'Shul', render: a => a.contributing_shuls?.length > 1
    ? `<div class="shul-pill-group">${a.contributing_shuls.map((n, i) => `<span class="shul-pill${i===0?' primary':''}">${esc(n)}</span>`).join('')}</div>`
    : esc(a.shul_name || (a.approval_status === 'soft_rejected' && a.previous_shul_name ? `Previously: ${a.previous_shul_name}` : '')) },
  { key: 'marital_status', label: 'Marital', render: a => esc(a.marital_status||'') },
  { key: 'contact', label: 'Contact', render: a => contactLine(a) },
  { key: 'email', label: 'Email', render: a => esc(a.email||'') },
  { key: 'home_phone', label: 'Home Phone', render: a => esc(a.home_phone||'') },
  { key: 'husband_cell', label: 'Husband Cell', render: a => esc(a.husband_cell||'') },
  { key: 'wife_cell', label: 'Wife Cell', render: a => esc(a.wife_cell||'') },
  { key: 'address', label: 'Address', render: a => esc([a.address,a.city,a.state,a.zip].filter(Boolean).join(', ')) },
  { key: 'num_children', label: 'Children', sort: 'num_children', render: a => a.num_children ?? 0 },
  { key: 'home_for_yomtov', label: 'Home Yom Tov', render: a => a.home_for_yomtov ? 'Yes' : 'No' },
  { key: 'approval_status', label: 'Status', sort: 'approval_status', render: a => badge(a.approval_status, a.approval_status)
    + (a.approval_status === 'rejected' && a.rejection_reason ? `<div class="rejection-reason" title="${esc(a.rejection_reason)}">${esc(a.rejection_reason)}</div>` : '') },
  { key: 'card_amount', label: 'Card $', sort: 'card_amount', render: a => a.card_amount != null ? fmtMoney(a.card_amount) : '' },
  { key: 'provider_sync', label: 'Disccardpromos', render: a => providerSyncBadge(a.provider_sync) },
  { key: 'provider_check_status', label: 'Disccardpromos Says', render: a => providerCheckBadge(a.provider_check_status) },
  { key: 'comments', label: 'Comments', render: a => esc(a.comments||'') },
  { key: 'created_at', label: 'Submitted', sort: 'created_at', render: a => fmtDate(a.created_at) },
];
const DEFAULT_APPLICANT_COLUMNS = ['external_id','name','shul','marital_status','contact','num_children','home_for_yomtov','approval_status','card_amount','created_at'];
let activeColumns = DEFAULT_APPLICANT_COLUMNS;

function renderThead() {
  const cols = activeColumns.map(k => APPLICANT_COLUMNS.find(c => c.key === k)).filter(Boolean);
  qs('#thead').innerHTML = `<tr>
    <th style="width:34px"><input type="checkbox" id="chk-all"></th>
    ${cols.map(c => `<th ${c.sort ? `data-sort="${c.sort}"` : ''}>${esc(c.label)}</th>`).join('')}
    <th></th>
  </tr>`;
  qs('#chk-all').addEventListener('change', (e) => { qsa('.row-chk:not(:disabled)').forEach(c => { c.checked = e.target.checked; c.dispatchEvent(new Event('change')); }); });
}
qs('#thead').parentElement.addEventListener('click', (e) => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const key = th.dataset.sort;
  state.dir = (state.sort === key && state.dir === 'DESC') ? 'ASC' : 'DESC';
  state.sort = key; load();
});

async function load() {
  const params = new URLSearchParams(Object.fromEntries(Object.entries(state).filter(([,v]) => v !== '')));
  const providerSyncBannerText = { missing: 'Showing only approved applicants missing a disccardpromos account.', deactivated: 'Showing only no-longer-approved applicants that still carry a real disccardpromos account.' }[state.provider_sync]
    || (state.provider_check ? `Showing only applicants disccardpromos reported as "${PROVIDER_CHECK_LABELS[state.provider_check] || state.provider_check}" in the last verification.` : '');
  qs('#provider-sync-banner').innerHTML = providerSyncBannerText
    ? `<div class="card" style="padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
        <span>${providerSyncBannerText}</span>
        <button class="btn btn-sm btn-outline" onclick="clearProviderSyncFilter()">Clear filter</button>
      </div>` : '';
  try {
    const { applicants, total } = await api('/applicants?' + params);
    for (const a of applicants) selectedMeta.set(a.id, a);
    const cols = activeColumns.map(k => APPLICANT_COLUMNS.find(c => c.key === k)).filter(Boolean);
    qs('#tbody').innerHTML = applicants.length ? applicants.map(a => rowHtml(a, cols)).join('') : `<tr><td colspan="${cols.length+2}" class="empty-state">No applicants found.</td></tr>`;
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    qs('#pager').innerHTML = `<button class="btn btn-sm btn-outline" ${state.page<=1?'disabled':''} onclick="changePage(-1)">Prev</button> Page ${state.page} of ${pages} (${total} total) <button class="btn btn-sm btn-outline" ${state.page>=pages?'disabled':''} onclick="changePage(1)">Next</button>`;
    qsa('.row-chk').forEach(c => c.addEventListener('change', onCheck));
  } catch (err) { toast(err.message, true); }
}
function changePage(d) { state.page += d; load(); }

function rowHtml(a, cols) {
  return `<tr onclick="openApplicant('${a.id}')" style="cursor:pointer">
    <td onclick="event.stopPropagation()"><input type="checkbox" class="row-chk" data-id="${a.id}"></td>
    ${cols.map(c => `<td>${c.render(a)}</td>`).join('')}
    <td><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openApplicant('${a.id}')">View</button></td>
  </tr>`;
}

function onCheck(e) {
  const id = e.target.dataset.id;
  if (e.target.checked) selected.add(id); else selected.delete(id);
  qs('#btn-mass-apply').textContent = `Apply to Selected (${selected.size})`;
  qs('#btn-mass-apply').disabled = selected.size === 0;
}

qs('#f-search').addEventListener('input', debounce(() => { state.search = qs('#f-search').value; state.page = 1; load(); }, 350));
qs('#f-status').addEventListener('change', () => { state.status = qs('#f-status').value; state.page = 1; load(); });
qs('#f-paused').addEventListener('change', () => { state.paused = qs('#f-paused').value; state.page = 1; load(); });
qs('#f-marital').addEventListener('change', () => { state.marital_status = qs('#f-marital').value; state.page = 1; load(); });
qs('#f-shul').addEventListener('change', () => { state.shul_id = qs('#f-shul').value; state.page = 1; load(); });
qs('#f-amount-min').addEventListener('input', debounce(() => { state.amount_min = qs('#f-amount-min').value; state.page = 1; load(); }, 350));
qs('#f-amount-max').addEventListener('input', debounce(() => { state.amount_max = qs('#f-amount-max').value; state.page = 1; load(); }, 350));
qs('#f-season').addEventListener('change', () => {
  state.season_id = qs('#f-season').value; state.page = 1;
  // The shul filter is scoped to the season (a shul is a fresh row every
  // season) — a shul picked under the old season almost certainly isn't a
  // valid id in the new one, so reset the filter along with the list rather
  // than silently keep filtering by a shul_id that can never match anything.
  state.shul_id = ''; populateShulFilter('f-shul', state.season_id);
  load();
});
qs('#f-pagesize').value = state.pageSize;
qs('#f-pagesize').addEventListener('change', () => { state.pageSize = +qs('#f-pagesize').value; state.page = 1; Auth.savePageSize('applicants', state.pageSize); load(); });
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

qs('#btn-template').addEventListener('click', () => downloadAuthed('/applicants/import/template', 'applicant_import_template.xlsx'));
qs('#btn-export').addEventListener('click', () => downloadAuthed('/applicants/export?' + new URLSearchParams(Object.fromEntries(Object.entries(state).filter(([k,v]) => v !== '' && !['sort','dir','page','pageSize'].includes(k)))), 'applicants.xlsx'));
qs('#btn-new').addEventListener('click', () => openApplicantForm());
qs('#btn-import').addEventListener('click', () => openImportModal());
qs('#f-dupes').addEventListener('click', showDuplicates);
qs('#btn-appeals').addEventListener('click', showAppeals);
qs('#btn-provider-sync').addEventListener('click', showProviderSync);

// null = not approved (irrelevant); the three real states an approved
// applicant can be in — see providerSyncStatus() in routes/applicants.js
// for what each one actually means. A $0 card amount is NOT its own state
// here — both approve routes always attempt the account write regardless
// of amount (amount only gates whether funds get loaded onto it after),
// so a $0 applicant still shows as 'synced' once the account exists.
function providerSyncBadge(status) {
  if (!status) return '';
  const labels = { synced: 'Synced', exempt: 'Exempt', missing: 'Missing', deactivated: 'Deactivated' };
  const classes = { synced: 'approved', exempt: 'submitted', missing: 'rejected', deactivated: 'pending' };
  return badge(labels[status] || status, classes[status] || status);
}

// Answers "594 approved but only 567 in disccardpromos" directly, with the
// breakdown behind the gap — 'exempt' is expected and not a problem;
// 'missing' is the one number worth acting on.
// Status only — nothing here needs clicking to keep the two systems matched.
// The automatic match (routes/applicants.js's enforceProviderForOrg) runs
// on its own after every deploy, every 15 minutes, and right after any
// approval/rejection whose disccardpromos call failed. This just shows the
// last run's verdict and the few things only a human can fix (an approved
// applicant with no shul, a data value disccardpromos rejects outright).
async function showProviderSync() {
  try {
    const params = seasonParam();
    const [s, e] = await Promise.all([api('/applicants/provider-sync-summary' + params), api('/applicants/provider-enforce' + params)]);
    const r = e.result;
    const verdict = e.status === 'running'
      ? `<p><strong>Automatic match is running right now</strong> (${e.progress} of ${e.total || '…'})…</p>`
      : !r ? `<p class="small-muted">The automatic match hasn't run for this season yet. It runs about 40 seconds after every deploy or restart, then every 15 minutes. (It never runs while the season has no live disccardpromos API key.)</p>`
      : r.matched
        ? `<p style="color:var(--success,green)"><strong>Matched.</strong> disccardpromos active accounts: <strong>${r.after.active}</strong> = your distinct accounts: <strong>${r.ours.distinctActiveAccounts}</strong>. Last checked ${fmtDateTime(r.ranAt)}.</p>`
        : `<p style="color:var(--danger)"><strong>Not matched.</strong> disccardpromos active: <strong>${r.after?.active ?? '?'}</strong> vs your distinct accounts: <strong>${r.ours.distinctActiveAccounts}</strong>. Last run ${fmtDateTime(r.ranAt)}.${r.after ? '' : ' (Their customer list could not be pulled on that run.)'}</p>`;
    const needs = r?.unfixable?.length
      ? `<p class="small-muted" style="margin-top:10px;color:var(--danger)"><strong>${r.unfixable.length} need a human</strong> — the automatic match cannot fix these:</p><ul style="margin:6px 0 0;padding-left:18px;font-size:13px">${r.unfixable.map(u => `<li>${esc(u.name)} — ${esc(u.reason)}</li>`).join('')}</ul>`
      : '';
    const body = `
      ${verdict}
      ${needs}
      <table style="width:100%;margin-top:12px">
        <tr><td>Approved applicants this season</td><td style="text-align:right"><strong>${s.approved}</strong></td></tr>
        ${r ? `<tr><td>… sharing one account as merged duplicates</td><td style="text-align:right">${r.counts.sharedByMerge}</td></tr>` : ''}
        <tr><td>… exempt (backfill import — never sent, on purpose)</td><td style="text-align:right">${s.exempt}</td></tr>
        <tr><td>… without any account right now</td><td style="text-align:right">${s.missing}</td></tr>
        <tr style="border-top:1px solid var(--border)"><td><strong>Distinct accounts that should be active</strong></td><td style="text-align:right"><strong>${r ? r.ours.distinctActiveAccounts : s.distinctAccounts}</strong></td></tr>
        ${r?.after ? `
          <tr style="border-top:1px solid var(--border)"><td>disccardpromos — active</td><td style="text-align:right"><strong>${r.after.active}</strong></td></tr>
          <tr><td>disccardpromos — inactive (rejected/pending/held by nobody, locked on purpose)</td><td style="text-align:right">${r.after.inactive}</td></tr>
          <tr><td>disccardpromos — total customers</td><td style="text-align:right">${r.after.total}</td></tr>` : ''}
      </table>
      ${r ? `<p class="small-muted" style="margin-top:12px">Last run: ${r.counts.alreadyRight} already right · ${r.counts.relinked} relinked · ${r.counts.reactivated} re-activated · ${r.counts.created} created${r.counts.fundsLoaded ? ` (${r.counts.fundsLoaded} loaded with funds)` : ''} · ${r.counts.deactivatedNonApproved + r.counts.deactivatedOrphans} deactivated.</p>` : ''}
      ${r?.notes?.length ? `<p class="small-muted" style="margin-top:8px">Notes:</p><ul style="margin:6px 0 0;padding-left:18px;font-size:13px">${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    `;
    const footer = `
      ${s.missing ? `<button class="btn btn-outline btn-sm" onclick="closeModal();viewMissingProviderSync()">View the ${s.missing} without an account</button>` : ''}
      <button class="btn btn-outline btn-sm" onclick="closeModal();startProviderAudit()">Verify Against Disccardpromos (read-only)</button>
    `;
    openModal('Disccardpromos Match Status', body, footer);
  } catch (err) { toast(err.message, true); }
}
function viewMissingProviderSync() {
  qs('#f-status').value = 'approved'; state.status = 'approved';
  state.provider_sync = 'missing'; state.page = 1;
  load();
}
// Deactivated spans every non-approved status (rejected/pending/soft_rejected)
// — clears the status filter entirely rather than forcing one, unlike
// viewMissingProviderSync which only ever means 'approved'.
function viewDeactivatedProviderSync() {
  qs('#f-status').value = ''; state.status = '';
  state.provider_sync = 'deactivated'; state.page = 1;
  load();
}
function clearProviderSyncFilter() { state.provider_sync = ''; state.provider_check = ''; load(); }

// --- Verify Against Disccardpromos — ground truth from their API, both
// directions. See routes/applicants.js's runProviderAudit for what each
// outcome means. Runs server-side as a job (one API call per account), so
// this polls for progress and then renders the saved result.
const PROVIDER_CHECK_LABELS = { active: 'Exists, active', inactive: 'Exists, inactive', not_found: 'Does not exist', mock: 'Mock-mode id (never real)', error: 'Could not check', relinked: 'Found + relinked', missing: 'No account there either', cleared: 'Phantom id cleared' };
function providerCheckBadge(status) {
  if (!status) return '';
  const classes = { active: 'approved', inactive: 'pending', not_found: 'rejected', mock: 'rejected', error: 'rejected', relinked: 'approved', missing: 'rejected', cleared: 'submitted' };
  return badge(PROVIDER_CHECK_LABELS[status] || status, classes[status] || 'submitted');
}
function seasonParam() { return state.season_id ? `?season_id=${state.season_id}` : ''; }
function seasonBody() { return state.season_id ? { season_id: state.season_id } : {}; }
async function startProviderAudit() {
  try {
    await api('/applicants/provider-audit', { method: 'POST', body: seasonBody() });
  } catch (err) {
    // 409 = already running: just attach to it and show progress.
    if (!/already running/i.test(err.message)) { toast(err.message, true); return; }
  }
  openModal('Verifying Against Disccardpromos', `<p id="provider-audit-progress">Starting…</p><p class="small-muted">One call per account — a few hundred accounts takes a minute or two. You can close this; the result is saved and reopens from the same button.</p>`, '');
  const poll = async () => {
    let r;
    try { r = await api('/applicants/provider-audit' + seasonParam()); } catch (err) { toast(err.message, true); return; }
    if (r.status === 'running') {
      const el = qs('#provider-audit-progress');
      if (el) el.textContent = `Checked ${r.progress} of ${r.total || '…'}`;
      setTimeout(poll, 1500);
      return;
    }
    if (r.status === 'error') { openModal('Verification Failed', `<p style="color:var(--danger)">${esc(r.error || 'Unknown error')}</p>`, ''); return; }
    showProviderAuditResult(r.result);
  };
  setTimeout(poll, 800);
}
async function showLastProviderAudit() {
  try {
    const r = await api('/applicants/provider-audit' + seasonParam());
    if (r.status === 'running') return startProviderAudit();
    if (!r.result) return toast('No verification has been run for this season yet.', true);
    showProviderAuditResult(r.result);
  } catch (err) { toast(err.message, true); }
}
function showProviderAuditResult(res) {
  const o = res.ours, p = res.provider;
  const list = (items, fmt) => items.length ? `<ul style="margin:6px 0 0;padding-left:18px;font-size:13px">${items.slice(0, 60).map(fmt).join('')}${items.length > 60 ? `<li>…and ${items.length - 60} more (use the View button)</li>` : ''}</ul>` : '';
  const phantom = o.not_found + o.mock;
  const body = `
    <p class="small-muted">Ran ${fmtDateTime(res.ranAt)}. Every account id this season holds was checked directly against disccardpromos${p ? ', and their full customer list was pulled for the reverse check' : ''}.</p>
    <table style="width:100%">
      <tr><td>Distinct account ids we hold</td><td style="text-align:right"><strong>${o.distinctAccounts}</strong></td></tr>
      <tr><td>… disccardpromos confirms, active</td><td style="text-align:right">${o.active}</td></tr>
      <tr><td>… disccardpromos confirms, inactive</td><td style="text-align:right">${o.inactive}</td></tr>
      <tr><td style="color:var(--danger)">… disccardpromos says do NOT exist</td><td style="text-align:right;color:var(--danger)"><strong>${o.not_found}</strong></td></tr>
      <tr><td style="color:var(--danger)">… mock-mode placeholders (never real)</td><td style="text-align:right;color:var(--danger)"><strong>${o.mock}</strong></td></tr>
      ${o.error ? `<tr><td>… could not be checked (API error)</td><td style="text-align:right">${o.error}</td></tr>` : ''}
      <tr><td>Approved applicants with no id here, but found on disccardpromos and relinked</td><td style="text-align:right">${o.relinked}</td></tr>
      <tr><td>Approved applicants with no account anywhere (still missing)</td><td style="text-align:right">${o.stillMissing}</td></tr>
      ${p ? `
        <tr style="border-top:1px solid var(--border)"><td><strong>disccardpromos' own customer count</strong></td><td style="text-align:right"><strong>${p.total}</strong></td></tr>
        <tr><td>… active / inactive</td><td style="text-align:right">${p.active} / ${p.inactive}</td></tr>

// --- Make Disccardpromos Match — see routes/applicants.js's
// runProviderEnforce. One job, in order: link/reactivate/create for every
// approved applicant, deactivate everything nobody approved holds, then
// re-pull their list and show their active count next to ours.
async function startProviderEnforce() {
  if (!confirm('Make disccardpromos match this season?\n\n• Every approved applicant gets one ACTIVE account (existing ones are re-activated or linked; missing ones are CREATED and loaded with their Card Amount — real money).\n• Accounts held only by rejected/pending applicants, or by nobody, are DEACTIVATED (never deleted).\n\nSafe to run again any time. Continue?')) return;
  try {
    await api('/applicants/provider-enforce', { method: 'POST', body: seasonBody() });
  } catch (err) {
    if (!/already in progress/i.test(err.message)) { toast(err.message, true); return; }
  }
  openModal('Making Disccardpromos Match', `<p id="provider-enforce-progress">Starting…</p><p class="small-muted">Only applicants that actually need a change trigger a call, so this is usually quick. You can close this; the result is saved.</p>`, '');
  const poll = async () => {
    let r;
    try { r = await api('/applicants/provider-enforce' + seasonParam()); } catch (err) { toast(err.message, true); return; }
    if (r.status === 'running') {
      const el = qs('#provider-enforce-progress');
      if (el) el.textContent = `Processed ${r.progress} of ${r.total || '…'}`;
      setTimeout(poll, 1500); return;
    }
    if (r.status === 'error') { openModal('Match Run Failed', `<p style="color:var(--danger)">${esc(r.error || 'Unknown error')}</p>`, ''); return; }
    showProviderEnforceResult(r.result);
    load();
  };
  setTimeout(poll, 800);
}
function showProviderEnforceResult(r) {

    ? (r.matched

    : `<p style="margin-top:12px;color:var(--danger)">Their list could not be re-pulled for the final tally — run again.</p>`;
  const body = `

    <table style="width:100%">
      <tr><td>Approved applicants this season</td><td style="text-align:right"><strong>${o.approved}</strong></td></tr>

      <tr style="border-top:1px solid var(--border)"><td><strong>= distinct accounts that should be active</strong></td><td style="text-align:right"><strong>${o.distinctActiveAccounts}</strong></td></tr>
      <tr style="border-top:1px solid var(--border)"><td>disccardpromos active before → after</td><td style="text-align:right">${r.before.active} → <strong>${r.after ? r.after.active : '?'}</strong></td></tr>
      <tr><td>disccardpromos inactive before → after</td><td style="text-align:right">${r.before.inactive} → ${r.after ? r.after.inactive : '?'}</td></tr>

    ${r.unfixable.length ? `<p class="small-muted" style="margin-top:10px;color:var(--danger)"><strong>Still need a human:</strong></p>${list(r.unfixable, u => `<li>${esc(u.name)} — ${esc(u.reason)}</li>`)}` : ''}

  `;
  openModal('Disccardpromos Match Result', body, `<button class="btn btn-outline btn-sm" onclick="closeModal();startProviderEnforce()">Run Again</button>`);

const MASS_ACTIONS = {
  approve: {
    confirm: null,
    run: (ids) => {
      const amount = prompt("Card amount to set for all selected (leave blank to use each applicant's existing/default amount):", '');
      const body = { ids };
      if (amount !== null && amount !== '') body.card_amount = +amount;
      return api('/applicants/mass-approve', { method: 'POST', body });
    },
    summarize: r => {
      let msg = `Approved ${r.approved}, skipped ${r.skipped}${r.capReached ? ' (season capacity reached)' : ' (paused)'}`;
      if (r.contributionBlocked) msg += ` — ${r.contributionBlocked} skipped: shul contribution not confirmed / below minimum`;
      if (r.providerErrors) {
        msg += ` — ${r.providerErrors} disccardpromos issue(s)`;
        // Real per-applicant reasons, not just a bare count — see the
        // comment on providerErrorDetails in the mass-approve route. Only
        // the first few are shown inline (a large batch could otherwise
        // produce an unreadably long toast); providerErrorsHint still covers
        // the single most common case (no Package/Discount ID configured).
        if (r.providerErrorDetails?.length) msg += `: ${r.providerErrorDetails.slice(0, 3).join('; ')}${r.providerErrorDetails.length > 3 ? `; +${r.providerErrorDetails.length - 3} more (see Recent Actions for the full list)` : ''}`;
        else if (r.providerErrorsHint) msg += `: ${r.providerErrorsHint}`;
      }
      // Not an "error" (an intentionally-comped applicant looks identical),
      // but used to be silent — indistinguishable from funds genuinely
      // loading. If this fires for most/all of a batch, the amount typed
      // into the prompt above was left blank AND the applicants' own Card
      // Amount / the season's default are $0 or unset.
      if (r.zeroAmountSkipped) msg += ` — ${r.zeroAmountSkipped} had a $0 card amount, nothing sent to disccardpromos`;
      return { msg, isError: !!r.providerErrors || !!r.contributionBlocked || !!r.zeroAmountSkipped };
    },
  },
  reject: {
    confirm: n => `Reject ${n} selected applicant(s)?`,
    run: (ids) => api('/applicants/mass-reject', { method: 'POST', body: { ids } }),
    summarize: r => ({ msg: `Rejected ${r.rejected}, skipped ${r.skipped}`, isError: !!r.cardLockErrors }),
  },
  'set-pending': {
    confirm: n => `Move ${n} selected applicant(s) back to pending?`,
    run: (ids) => api('/applicants/mass-set-pending', { method: 'POST', body: { ids } }),
    summarize: r => ({ msg: `Updated ${r.updated}, skipped ${r.skipped}`, isError: !!r.cardLockErrors }),
  },
  delete: {
    confirm: n => `Permanently delete ${n} selected applicant(s)? This removes each applicant, their cards, and notes completely and cannot be undone.`,
    run: (ids) => api('/applicants/mass-delete-permanent', { method: 'POST', body: { ids } }),
    summarize: r => ({ msg: `Deleted ${r.deleted}, skipped ${r.skipped}`, isError: !!r.cardLockErrors }),
  },
  email: {
    confirm: null,
    run: (ids) => openMassMessageModal('applicant', 'email', ids),
    summarize: r => ({ msg: `Sent to ${r.sent} of ${r.total} recipient(s)${r.failed ? `, ${r.failed} failed` : ''}`, isError: !!r.failed && r.sent === 0 }),
  },
  sms: {
    confirm: null,
    run: (ids) => openMassMessageModal('applicant', 'sms', ids),
    summarize: r => ({ msg: `Sent to ${r.sent} of ${r.total} recipient(s)${r.failed ? `, ${r.failed} failed` : ''}`, isError: !!r.failed && r.sent === 0 }),
  },
};

};

let dupFlagsCache = [];
let dupSearchTerm = '';
async function showDuplicates() {
  mergeViewReturnToApplicant = null;
  try {
    const { flags } = await api('/applicants/duplicates/open' + (state.season_id ? `?season_id=${state.season_id}` : ''));
    dupFlagsCache = flags;
    renderDuplicatesList();
  } catch (err) { toast(err.message, true); }
}
function renderDuplicatesList() {
  const body = `<input id="dup-search" placeholder="Search by name, shul, or reason…" value="${esc(dupSearchTerm)}" style="margin-bottom:12px">
    <div id="dup-list">${renderDupListOnly()}</div>`;
  const footer = `<button class="btn btn-outline btn-sm" onclick="recheckAllDuplicates()">Recheck All (org-wide)</button>
    <button class="btn btn-outline btn-sm" onclick="collapseMergedGroups()">Collapse Old Merges Into One Record</button>`;
  openModal('Duplicate Applicant Flags', body, footer);
  qs('#dup-search').addEventListener('input', (e) => { dupSearchTerm = e.target.value; qs('#dup-list').innerHTML = renderDupListOnly(); });
  qs('#dup-search').focus();
  qs('#dup-search').selectionStart = qs('#dup-search').selectionEnd = dupSearchTerm.length;
}
// 'incomplete' (carried-forward, awaiting re-enrollment) applicants used to
// still get checked as the SUBJECT of a duplicate check on every edit,
// which could flag+pause one before it was ever re-enrolled — see
// services/duplicates.js's checkApplicantDuplicate. This sweep undoes any
// flag that only exists because of that (org-wide, since it could be
// sitting in any season) and freshly re-checks every other currently-
// unpaused real applicant to catch anything a bug ever let through.
async function recheckAllDuplicates() {
  if (!confirm('Recheck every applicant org-wide? This clears any duplicate flag caused by the incomplete-applicant bug, and freshly checks everyone else for anything that was missed. Safe to re-run.')) return;
  try {
    const r = await api('/applicants/duplicates/recheck-all', { method: 'POST', body: {} });
    toast(`Checked ${r.checked}. Cleared ${r.cleared} spurious flag(s), unpaused ${r.unpaused} orphaned pause(s), found ${r.flagged} new one(s).`);
    showDuplicates();
  } catch (err) { toast(err.message, true); }
}
function renderDupListOnly() {
  const term = dupSearchTerm.trim().toLowerCase();
  const flags = term
    ? dupFlagsCache.filter(f => [f.entity?.first_name, f.entity?.last_name, f.entity?.shul_name, f.matched?.first_name, f.matched?.last_name, f.matched?.shul_name, f.reason]
        .some(v => (v || '').toLowerCase().includes(term)))
    : dupFlagsCache;
  return flags.length ? flags.map(f => `<div class="card" style="margin-bottom:10px">
      <strong>${esc(f.entity?.first_name)} ${esc(f.entity?.last_name)}</strong> (${esc(f.entity?.shul_name||'')}) may duplicate
      <strong>${esc(f.matched?.first_name)} ${esc(f.matched?.last_name)}</strong> (${esc(f.matched?.shul_name||'')})<br>
      <span class="small-muted">Reason: ${esc(f.reason)}</span>
      <div style="margin-top:10px">
        <button class="btn btn-sm btn-primary" onclick="openMergeView('${f.id}')">Compare &amp; Resolve</button>
      </div>
    </div>`).join('') : `<p class="small-muted">${dupFlagsCache.length ? 'No flags match your search.' : 'No open duplicate flags.'}</p>`;
}

let appealsCache = [];

      <div><strong>${esc(a.first_name)} ${esc(a.last_name)}</strong> <span class="small-muted">(${esc(a.external_id||'')})</span><br>
        <span class="small-muted">${esc(a.shul_name)} is asking why this was rejected — requested ${fmtDateTime(a.created_at)}</span></div>

let appealTemplatesCache = [];
window.openRespondAppeal = async (appealId) => {
  const a = appealsCache.find(x => x.id === appealId);
  if (!a) return;
  try { appealTemplatesCache = (await api('/applicants/rejection-reason-templates')).templates; } catch { appealTemplatesCache = []; }
  const templateOptions = `<option value="">Write your own</option>` + appealTemplatesCache.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const body = `
    <p class="small-muted"><strong>${esc(a.first_name)} ${esc(a.last_name)}</strong> — ${esc(a.shul_name)} asked why this applicant was rejected.</p>
    ${appealTemplatesCache.length ? `<label>Use Saved Reason</label><select id="ar-template" onchange="applyAppealTemplate()">${templateOptions}</select>` : ''}
    <label>Reason</label><textarea id="ar-reason" rows="5" placeholder="Explain why this applicant was rejected…"></textarea>
    <div class="checkbox-row" style="margin-top:10px"><input type="checkbox" id="ar-save-template"><label style="margin:0">Save this as a reusable reason</label></div>
    <div id="ar-save-name-wrap" style="display:none;margin-top:8px"><label>Reason Name</label><input id="ar-save-name" placeholder="e.g. Outside service area"></div>
  `;
  openModal('Respond to Appeal', body, `<button class="btn btn-primary btn-sm" id="btn-send-appeal-response" onclick="submitAppealResponse('${appealId}')">Send Response</button>`);
  qs('#ar-save-template').addEventListener('change', (e) => { qs('#ar-save-name-wrap').style.display = e.target.checked ? 'block' : 'none'; });
};
window.applyAppealTemplate = () => {
  const t = appealTemplatesCache.find(x => x.id === qs('#ar-template').value);
  qs('#ar-reason').value = t ? t.body : '';
};
window.submitAppealResponse = async (appealId) => {
  const btn = qs('#btn-send-appeal-response');
  if (btn.disabled) return;
  const reason = qs('#ar-reason').value.trim();
  if (!reason) return toast('Enter a reason', true);
  const saveTemplate = qs('#ar-save-template').checked;
  const templateName = qs('#ar-save-name').value.trim();
  if (saveTemplate && !templateName) return toast('Enter a name for the saved reason', true);
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    if (saveTemplate) await api('/applicants/rejection-reason-templates', { method: 'POST', body: { name: templateName, body: reason } });
    const r = await api(`/applicants/appeals/${appealId}/respond`, { method: 'POST', body: { reason } });
    toast(r.emailError ? `Sent, but email failed: ${r.emailError}` : 'Response sent');
    appealsCache = appealsCache.filter(a => a.id !== appealId);
    if (appealsCache.length) renderAppealsList(); else closeModal();
    load();
    refreshHeaderBadges();
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = 'Send Response';
  }
};

// The merge group can be more than a pair — the same family can get
// submitted by three, four, five different shuls in one season. Rather than
// comparing all N side by side in one wide table (unreadable past 3-4, and
// "Dismiss" never actually resolved anything — a dismissed member's flag
// just sat open and the whole group kept reappearing forever), a group of
// 3+ is worked through two records at a time: pick exactly 2, compare and
// resolve THAT pair for real (merge or bypass — both are permanent, real
// backend actions), and the result rejoins the pool to be compared against
// whichever member is still unresolved next. Always fetches the FULL
// connected group fresh (see GET /applicants/duplicates/:flagId/group),
// including every open flag between any two of its members — needed to
// know, for whichever pair gets picked, what they were actually flagged
// for and whether bypass is even possible (only a DIRECT flag between the
// two chosen members can be bypassed; two that are only transitively
// related through a third member have no flag to close).
let mergeGroupCache = null;
// Set only when opened from an applicant's own profile (see openApplicant's
// "View & Resolve" button) rather than the Duplicates list, so the compare
// view's Back button can return to that profile directly instead of always
// landing on the full list — the whole point of surfacing this from the
// profile in the first place.
let mergeViewReturnToApplicant = null;
// The up-to-2 member ids currently picked for a pairwise compare. Reset on
// every fresh group open and after every resolved pair.
let mergePairSelection = [];
window.openMergeView = async (flagId, fromApplicantId) => {
  mergeViewReturnToApplicant = fromApplicantId || null;
  mergePairSelection = [];
  try {
    const group = await api(`/applicants/duplicates/${flagId}/group`);
    mergeGroupCache = group;
    // Closed only once the fetch succeeds — an errored fetch below leaves
    // whatever modal was already open (profile or list) in place instead of
    // vanishing into a blank screen. Explicit close before the next
    // openModal() matters here specifically: unlike every other same-modal
    // transition in this app, this one can be reached from a DIFFERENT
    // modal (the applicant profile) and hands back to it later (Back to
    // Applicant, below) — without this, that round trip stacks multiple
    // #ec-modal backdrops (openModal never removes a prior one), and the
    // leftover invisible ones intercept clicks on whatever's rendered on
    // top.
    closeModal();
    renderMergeView();
  } catch (err) { toast(err.message, true); }
};
// A member already folded into someone else (via a merge earlier in THIS
// pairwise flow, or an older one) drops out — its primary stands in for it
// from here on. merge_group_id === own id means "still its own primary"
// (either never merged, or IS the primary); anything else means "already
// resolved into that id."
function activeMergeMembers() {
  return mergeGroupCache.members.filter(m => !m.merge_group_id || m.merge_group_id === m.id);
}
// Dispatches to whichever screen the current group state calls for: fully
// resolved, a plain pair (no picker needed — same as the original 2-record
// flow), a pair already picked mid-flow, or the picker itself.
function renderMergeView() {
  const active = activeMergeMembers();
  // "Done" isn't just "down to 1 person" — it's also reached the moment
  // nothing among whoever's left is still an open question. Two survivors
  // that were already directly bypassed against each other (or were never
  // flagged against each other at all) have nothing left to compare, even
  // though both are still technically "active" individuals.
  const stillConnected = mergeGroupCache.flags.some(f => active.some(m => m.id === f.entity_id) && active.some(m => m.id === f.matched_entity_id));
  if (active.length <= 1 || !stillConnected) return renderMergeDone();
  if (active.length === 2) { mergePairSelection = [active[0].id, active[1].id]; return renderPairCompare(); }
  if (mergePairSelection.length === 2 && mergePairSelection.every(id => active.some(m => m.id === id))) return renderPairCompare();
  return renderPairPicker();
}
function mergeExitBtn() {
  return mergeViewReturnToApplicant
    ? `<button class="btn btn-outline btn-sm" onclick="closeModal();openApplicant('${mergeViewReturnToApplicant}')">Back to Applicant</button>`
    : `<button class="btn btn-outline btn-sm" onclick="closeModal();showDuplicates()">Back to List</button>`;
}
function renderMergeDone() {
  openModal('Compare & Merge Records', `<p>This duplicate group is fully resolved — nothing left to compare.</p>`, mergeExitBtn().replace('btn-outline', 'btn-primary'));
}
function renderPairPicker() {
  const active = activeMergeMembers();
  const body = `
    <p class="small-muted">This is a group of ${active.length} records still needing review. Pick exactly <strong>2</strong> to compare at a time — once that pair is resolved, the result rejoins the group so you can compare it against whoever's next.</p>
    <div>${active.map(m => {
      const checked = mergePairSelection.includes(m.id);
      const disabled = !checked && mergePairSelection.length >= 2;
      return `<label class="checkbox-row card" style="display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:10px 12px;${disabled ? 'opacity:.5' : ''}">
        <input type="checkbox" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="togglePairPick('${esc(m.id)}', this.checked)">
        <span><strong>${esc(m.first_name)} ${esc(m.last_name)}</strong> — ${esc(m.shul_name || (m.previous_shul_name ? `previously ${m.previous_shul_name}` : 'no shul'))} ${badge(m.approval_status, m.approval_status)}</span>
      </label>`;
    }).join('')}</div>
  `;
  const footer = `${mergeExitBtn()}<button class="btn btn-primary btn-sm" ${mergePairSelection.length === 2 ? '' : 'disabled'} onclick="renderPairCompare()">Compare Selected &rarr;</button>`;
  openModal('Compare & Merge Records', body, footer);
}
window.togglePairPick = (id, checked) => {
  if (checked) { if (mergePairSelection.length < 2) mergePairSelection.push(id); }
  else { mergePairSelection = mergePairSelection.filter(x => x !== id); }
  renderPairPicker();
};
function renderPairCompare() {
  const active = activeMergeMembers();
  const [idA, idB] = mergePairSelection;
  const a = active.find(m => m.id === idA), b = active.find(m => m.id === idB);
  if (!a || !b) { mergePairSelection = []; return renderMergeView(); } // stale selection safety net
  const members = [a, b];
  // Only a DIRECT flag between exactly these two can be bypassed — two
  // members only linked transitively through a third have nothing open to
  // close (see the mergeGroupCache comment above).
  const pairFlag = mergeGroupCache.flags.find(f => (f.entity_id === idA && f.matched_entity_id === idB) || (f.entity_id === idB && f.matched_entity_id === idA));
  // A soft-rejected member (no current shul) can't be picked as Primary —
  // the backend rejects it (see mergeApplicants's shul_id guard) since
  // there'd be no shul left to actually hold the resulting card. Default
  // the pre-checked radio to the first eligible member instead of always
  // index 0, so opening this view doesn't start on a choice that would
  // just get rejected on submit.
  const defaultPrimaryIdx = Math.max(0, members.findIndex(m => m.shul_id));
  const cols = members.map((m, i) => `<th style="min-width:200px">
      <div class="checkbox-row" style="margin-bottom:4px"><input type="radio" name="merge-primary" value="${esc(m.id)}" id="mp-${i}" ${i===defaultPrimaryIdx?'checked':''} ${m.shul_id?'':'disabled'}>
        <label for="mp-${i}" style="margin:0"><strong>${esc(m.first_name)} ${esc(m.last_name)}</strong></label></div>
      <span class="small-muted">${esc(m.shul_name || (m.previous_shul_name ? `previously ${m.previous_shul_name}` : 'no shul'))}</span><br>
      ${badge(m.approval_status, m.approval_status)}
    </th>`).join('');
  const rows = APPLICANT_MERGE_FIELDS.map(([key, label]) => {
    const cells = members.map((m, i) => {
      const v = m[key];
      const display = key === 'home_for_yomtov' ? (v ? 'Yes' : 'No') : (v ?? '');
      return `<td><label class="checkbox-row" style="margin:0"><input type="radio" name="mf-${key}" value="${esc(String(v ?? ''))}" ${i===0?'checked':''}> <span>${esc(String(display))}</span></label></td>`;
    }).join('');
    return `<tr><td class="small-muted" style="white-space:nowrap">${esc(label)}</td>${cells}</tr>`;
  }).join('');
  const body = `
    <p class="small-muted">${pairFlag ? `Flagged for: ${esc(pairFlag.reason)}.` : 'These two are only linked through another record in this group — no direct match reason between them.'}
    Pick which record is <strong>Primary</strong> (that's the one that keeps going forward as the real card-holder), then pick which value to keep for each field — you can mix and match.</p>
    <div style="overflow-x:auto"><table><thead><tr><th></th>${cols}</tr></thead><tbody>${rows}</tbody></table></div>
  `;
  // "Back to Group" only makes sense once a picker step actually happened
  // (an original group of 3+) — a plain 2-record group never had one, so it
  // exits the whole flow directly, same as before this rewrite.
  const backBtn = mergeGroupCache.members.length > 2
    ? `<button class="btn btn-outline btn-sm" onclick="mergePairSelection=[];renderMergeView()">Back to Group</button>`
    : mergeExitBtn();
  const isFinalPair = active.length === 2;
  const footer = `${backBtn}
    ${pairFlag ? `<button class="btn btn-outline btn-sm" onclick="bypassPair('${pairFlag.id}')">Bypass (not the same person)</button>` : ''}
    <button class="btn btn-primary btn-sm" onclick="submitPairMerge('${mergeGroupCache.flag.id}')">Merge &amp; ${isFinalPair ? 'Resolve' : 'Continue'}</button>`;
  openModal('Compare & Merge Records', body, footer);
}
// After either action: re-fetch the SAME working set of ids this view
// opened with (see ?ids= on GET .../group) — not a fresh transitive-closure
// re-derivation, which would reseed from just the original flag's two
// entities and can silently drop members still connected to each other but
// no longer to that original pair once its own connecting flags close one
// by one. Nobody this view already showed the admin should ever quietly
// disappear mid-review.
async function refreshMergeGroupAndContinue() {
  mergePairSelection = [];
  const ids = mergeGroupCache.members.map(m => m.id);
  try {
    mergeGroupCache = await api(`/applicants/duplicates/${mergeGroupCache.flag.id}/group?ids=${ids.join(',')}`);
  } catch (err) { toast(err.message, true); }
  renderMergeView();
  load();
}
window.bypassPair = async (flagId) => {
  try {
    await api(`/applicants/duplicates/${flagId}/resolve`, { method: 'POST', body: { action: 'bypass' } });
    toast('Marked as different people');
    await refreshMergeGroupAndContinue();
  } catch (err) { toast(err.message, true); }
};
window.submitPairMerge = async (flagId) => {
  const primaryId = qs('input[name="merge-primary"]:checked')?.value;
  if (!primaryId) return toast('Pick a primary record', true);
  const values = {};
  for (const [key] of APPLICANT_MERGE_FIELDS) {
    const el = qs(`input[name="mf-${key}"]:checked`);
    if (el) values[key] = key === 'num_children' || key === 'card_amount' ? (el.value === '' ? null : +el.value)
      : key === 'home_for_yomtov' ? (el.value === '1' || el.value === 'true' ? 1 : 0)
      : el.value;
  }
  try {
    await api(`/applicants/duplicates/${flagId}/merge`, { method: 'POST', body: { primaryId, values, memberIds: mergePairSelection } });
    toast('Merged');
    await refreshMergeGroupAndContinue();
  } catch (err) { toast(err.message, true); }
};

// Deliberately no load() in this initial-resolution .then() (only in the
// onChange callback above, fired later by an actual reorder) — the season
// filter below hasn't set state.season_id yet at this point, so calling
// load() here raced against populateSeasonFilter and could win, flashing
// every season's applicants for a moment before the season-filtered load()
// replaced it.
attachColumnCustomizer('btn-columns', 'columns_applicants', APPLICANT_COLUMNS, DEFAULT_APPLICANT_COLUMNS, (order) => { activeColumns = order; renderThead(); load(); })
  .then(order => { activeColumns = order; renderThead(); });
// Scoped to the resolved season, not called unscoped first — an unscoped
// call would flash every shul from every past season into the list for a
// moment before this one replaced it (same race shape #5 fixed for load()
// above).
// Deep link from a shul's profile ("View Applicants" button, ?shul_id=<id>)
// straight into that shul's already-filtered list. Applied inside
// populateShulFilter's .then() rather than as a separate top-level
// statement — that call fills the #f-shul <option> list asynchronously, so
// setting state.shul_id/the select's value any earlier would leave the
// dropdown showing "All Shuls" even though the table itself was already
// correctly filtered underneath.
const deepLinkShulId = new URLSearchParams(location.search).get('shul_id');
populateSeasonFilter('f-season').then(activeId => {
  state.season_id = activeId;
  populateShulFilter('f-shul', activeId).then(() => {
    if (deepLinkShulId) { state.shul_id = deepLinkShulId; qs('#f-shul').value = deepLinkShulId; }
    load();
  });
});

// Deep link from the "Notify on Document Signed" admin email (?id=<applicantId>)
// straight into that applicant's popup.
const deepLinkApplicantId = new URLSearchParams(location.search).get('id');
if (deepLinkApplicantId) openApplicant(deepLinkApplicantId);

// A record can change status entirely outside this admin's session (e.g.
// a document signed via a public link) — re-fetch the list whenever the
// tab regains focus so it doesn't sit stale indefinitely.
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
attachLiveRefresh('live-banner', async () => {
  const params = new URLSearchParams({ search: state.search, status: state.status, marital_status: state.marital_status, shul_id: state.shul_id, season_id: state.season_id, pageSize: 1 });
  const { total } = await api('/applicants?' + params);
  return total;
}, load);
// Badges the Duplicates and Appeals buttons with their open counts so a new
// one (e.g. an overnight import's flag, or a shul's appeal) doesn't sit
// unnoticed until someone happens to click in — mirrors the nav's
// pending-count dots for shuls/applicants/stores in app.js's renderShell.
// Re-called after responding to an appeal so the badge updates live.
function refreshHeaderBadges() {
  qs('#f-dupes').innerHTML = 'Duplicates';
  qs('#btn-appeals').innerHTML = 'Appeals';
  api('/dashboard/pending-counts').then(({ counts }) => {
    if (counts.duplicates) qs('#f-dupes').insertAdjacentHTML('beforeend', ` ${badge(String(counts.duplicates), 'rejected')}`);
    if (counts.appeals) qs('#btn-appeals').insertAdjacentHTML('beforeend', ` ${badge(String(counts.appeals), 'rejected')}`);
  }).catch(() => {});
}
refreshHeaderBadges();
api('/seasons/active').then(({ season }) => {
  if (!season || season.max_accepted_applicants == null) return;
  qs('#cap-banner').innerHTML = `<div class="card" style="margin-bottom:16px;${season.is_full ? 'border-color:var(--danger)' : ''}">
    <strong>${esc(season.name)} capacity:</strong> ${season.accepted_count} of ${season.max_accepted_applicants} accepted (${season.remaining} remaining)
    ${season.is_full ? ' <strong style="color:var(--danger)">This season is full — new applications are locked.</strong>' : ''}
  </div>`;
}).catch(() => {});
</script>
</body>
</html>
