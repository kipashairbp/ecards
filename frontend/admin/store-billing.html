<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Billing · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
<link rel="stylesheet" href="/css/exec-dashboard.css">
<style>
  .sb-store-picker { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .sb-store-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; }
  .sb-store-row:hover { background: var(--brand-panel-2); }
  .sb-store-row input { width: auto; }
</style>
</head>
<body>
<script src="/js/app.js"></script>
<script src="/js/usbanks.js"></script>
<script>
Auth.requireAdmin();
if (!Auth.can('store_billing')) { location.href = '/admin/dashboard'; }
const canEdit = Auth.can('store_billing', 'can_edit');

renderShell('/admin/store-billing', `
  <h2>Store Billing</h2>
  <div class="exec-kpi-grid" id="sb-summary"><div class="small-muted">Loading&hellip;</div></div>
  <div class="tabs" id="sb-tabs">
    <button class="active" data-t="invoices">Invoices</button>
    <button data-t="periods">Billing Periods</button>
    <button data-t="templates">Payment Emails</button>
  </div>

  <div id="panel-invoices">
    <div class="toolbar" style="margin-bottom:10px">
      <select id="sb-status-filter" onchange="loadInvoices()">
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
      <input id="sb-search" placeholder="Search store, period, amount, approver&hellip;" style="min-width:260px" oninput="renderInvoices()">
      ${['super_admin', 'org_admin'].includes(Auth.user()?.role) ? `<button class="btn btn-sm btn-outline" style="margin-left:auto" title="Every store with its full bank account and routing numbers — treat the file as confidential" onclick="downloadAuthed('/store-billing/stores/payment-info/export', 'store-bank-details.xlsx')">Download Store Bank Details (Excel)</button>` : ''}
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr>
        <th class="sb-sort" data-k="store_name" onclick="sortInvoices('store_name')">Store</th>
        <th class="sb-sort" data-k="period_start" onclick="sortInvoices('period_start')">Period</th>
        <th class="sb-sort" data-k="amount" onclick="sortInvoices('amount')">Amount</th>
        <th class="sb-sort" data-k="submitted_at" onclick="sortInvoices('submitted_at')">Submitted</th>
        <th>Attachment</th>
        <th class="sb-sort" data-k="status" onclick="sortInvoices('status')">Status</th>
        <th class="sb-sort" data-k="approved_for_payment" onclick="sortInvoices('approved_for_payment')">Approved for Payment</th>
        <th></th></tr></thead>
      <tbody id="tbody-invoices"><tr><td colspan="8" class="empty-state">Loading&hellip;</td></tr></tbody></table>
    </div>
  </div>

  <div id="panel-periods" style="display:none">
    <div class="flex-between"><p class="small-muted" style="margin:0">A billing period is a "please submit your invoice" request sent to the stores you choose.</p>
      ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="openIssueBillingModal()">+ Issue Billing Email</button>` : ''}</div>
    <div class="card" style="padding:0;overflow-x:auto;margin-top:10px">
      <table><thead><tr><th>Period</th><th>Invited</th><th>Submitted</th><th>Created</th><th></th></tr></thead>
      <tbody id="tbody-periods"><tr><td colspan="5" class="empty-state">Loading&hellip;</td></tr></tbody></table>
    </div>
  </div>

  <div id="panel-templates" style="display:none">
    <div class="flex-between"><p class="small-muted" style="margin:0;max-width:640px">The &ldquo;payment is on the way&rdquo; emails. The <strong>default</strong> template is pre-selected when you click Mark Payment Sent &mdash; you can still switch templates or edit the message for any single payment.</p>
      ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="openPaymentTemplate()">+ New Template</button>` : ''}</div>
    <div id="pt-list" style="margin-top:12px"><p class="small-muted">Loading&hellip;</p></div>
  </div>
`);

qsa('#sb-tabs button').forEach(b => b.addEventListener('click', () => {
  qsa('#sb-tabs button').forEach(x => x.classList.remove('active')); b.classList.add('active');
  ['invoices', 'periods', 'templates'].forEach(t => qs('#panel-' + t).style.display = t === b.dataset.t ? 'block' : 'none');
  if (b.dataset.t === 'periods') loadPeriods(); else if (b.dataset.t === 'templates') loadPaymentTemplates(); else loadInvoices();
}));

let allBills = [];
const sortState = { key: 'submitted_at', dir: -1 };
// Same card markup/stylesheet as the main Dashboard's KPI tiles (exec-dashboard.css).
const SB_ICONS = {
  paid: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  outstanding: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  approved: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  invoices: '<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg>',
};
function kpiCard(label, num, accent, icon) {
  return `<div class="exec-kpi-card" style="--kpi-accent:${accent}">
    <div class="exec-kpi-icon">${icon}</div>
    <div class="exec-kpi-num">${esc(num)}</div>
    <div class="exec-kpi-label">${esc(label)}</div>
  </div>`;
}
async function loadSummary() {
  try {
    const { summary: s } = await api('/store-billing/invoices/summary');
    const n = (c, w) => `${c} ${w}${c === 1 ? '' : 's'}`;
    qs('#sb-summary').innerHTML = [
      kpiCard(`Total Paid · ${n(s.paid_count, 'invoice')}`, fmtMoney(s.paid_amount), '#2e7d32', SB_ICONS.paid),
      kpiCard(`Total Outstanding · ${n(s.outstanding_count, 'pending invoice')}`, fmtMoney(s.outstanding_amount), '#c77d10', SB_ICONS.outstanding),
      kpiCard(`Approved, Awaiting Payment · ${s.approved_count} of ${s.outstanding_count}`, fmtMoney(s.approved_amount), '#1565c0', SB_ICONS.approved),
      kpiCard('Invoices Pending Review', String(s.outstanding_count - s.approved_count), '#6a1b9a', SB_ICONS.invoices),
    ].join('');
  } catch (err) { toast(err.message, true); }
}
async function loadInvoices() {
  try {
    const status = qs('#sb-status-filter').value;
    ({ bills: allBills } = await api(`/store-billing/invoices${status ? `?status=${status}` : ''}`));
    renderInvoices();
    loadSummary();
  } catch (err) { toast(err.message, true); }
}
window.sortInvoices = (key) => {
  if (sortState.key === key) sortState.dir = -sortState.dir; else { sortState.key = key; sortState.dir = key === 'amount' || key === 'submitted_at' || key === 'approved_for_payment' ? -1 : 1; }
  renderInvoices();
};
function approvalCell(b) {
  const editable = canEdit && b.status === 'pending';
  const amount = b.approved_amount != null ? b.approved_amount : (b.payable_amount ?? b.amount);
  const who = b.approved_at ? `<div class="small-muted" style="margin-top:3px">${b.approved_for_payment ? 'Approved' : 'Unapproved'} by ${esc(b.approved_by_name || 'unknown')} &middot; ${fmtDateTime(b.approved_at)}</div>` : '';
  return `<div style="display:flex;align-items:center;gap:8px;white-space:nowrap">
      <input type="checkbox" title="Approved for payment" ${b.approved_for_payment ? 'checked' : ''} ${editable ? '' : 'disabled'} onchange="setApproved('${b.id}', this.checked)">
      <span class="small-muted">$</span><input type="number" step="0.01" min="0" value="${Number(amount).toFixed(2)}" ${editable ? '' : 'disabled'} style="width:110px;padding:4px 6px" title="Amount approved for payment" onchange="setApprovedAmount('${b.id}', this.value)">
    </div>${who}`;
}
function renderInvoices() {
  const q = (qs('#sb-search')?.value || '').trim().toLowerCase();
  qsa('.sb-sort').forEach(th => { th.textContent = th.textContent.replace(/ [▲▼]$/, ''); if (th.dataset.k === sortState.key) th.textContent += sortState.dir > 0 ? ' ▲' : ' ▼'; });
  const rows = allBills
    .filter(b => !q || [b.store_name, b.period_label, b.period, String(b.amount), fmtMoney(b.amount), b.status, b.approved_by_name, b.file_name].some(v => String(v || '').toLowerCase().includes(q)))
    .sort((a, b) => { const k = sortState.key; let x = a[k], y = b[k]; if (k === 'amount' || k === 'approved_for_payment') { x = +x || 0; y = +y || 0; } else { x = String(x || '').toLowerCase(); y = String(y || '').toLowerCase(); } return (x < y ? -1 : x > y ? 1 : 0) * sortState.dir; });
  qs('#tbody-invoices').innerHTML = rows.length ? rows.map(b => `<tr>
      <td><a href="/admin/stores?id=${b.store_id}" title="Open store profile">${esc(b.store_name)}</a></td><td>${esc(b.period_label || '')}</td>
      <td>${fmtMoney(b.amount)}${b.fee_percent ? `<div class="small-muted" style="white-space:nowrap">${b.fee_waived ? 'Fee overridden' : `To pay ${fmtMoney(b.payable_amount)} <span title="${b.fee_percent}% processing fee">(&minus;${fmtMoney(b.fee_amount)})</span>`}</div>` : ''}</td><td>${fmtDateTime(b.submitted_at)}</td>
      <td>${b.file_name ? `<a href="#" onclick="downloadStoreInvoiceFile('${b.id}');return false;">${esc(b.file_name)}</a>` : '<span class="small-muted">&mdash;</span>'}</td>
      <td>${badge(b.status, b.status === 'completed' ? 'active' : b.status)}</td>
      <td>${approvalCell(b)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openStoreInvoiceModal('${b.id}', loadInvoices)">View</button></td>
    </tr>`).join('') : `<tr><td colspan="8" class="empty-state">${allBills.length ? 'No invoices match your search.' : 'No invoices here.'}</td></tr>`;
}
async function saveApproval(id, body) {
  try {
    const { bill } = await api(`/store-billing/invoices/${id}/approve-for-payment`, { method: 'POST', body });
    const i = allBills.findIndex(b => b.id === id); if (i >= 0) allBills[i] = { ...allBills[i], ...bill };
    renderInvoices(); loadSummary();
    toast(bill.approved_for_payment ? `Approved for payment: ${fmtMoney(bill.approved_amount)}` : 'Approval removed');
  } catch (err) { toast(err.message, true); renderInvoices(); }
}
window.setApproved = (id, checked) => saveApproval(id, { approved: checked });
window.setApprovedAmount = (id, value) => saveApproval(id, { amount: value });

// ===================== Billing Periods =====================

async function loadPeriods() {
  try {
    const { periods } = await api('/store-billing/periods');
    qs('#tbody-periods').innerHTML = periods.length ? periods.map(p => `<tr>
        <td>${esc(p.label)}</td><td>${p.invited_count}</td><td>${p.submitted_count}</td><td>${fmtDate(p.created_at)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="viewPeriod('${p.id}')">View</button></td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty-state">No billing periods issued yet.</td></tr>';
  } catch (err) { toast(err.message, true); }
}

window.viewPeriod = async (id) => {
  try {
    const { period, invited } = await api(`/store-billing/periods/${id}`);
    const body = `
      <p><strong>${esc(period.label)}</strong></p>
      <table><thead><tr><th>Store</th><th>Email</th><th>Submitted?</th></tr></thead>
      <tbody>${invited.map(i => `<tr><td>${esc(i.store_name)}</td><td>${badge(i.email_status, i.email_status === 'sent' ? 'active' : 'rejected')}</td><td>${i.submitted ? badge('yes', 'active') : badge('no', 'pending')}</td></tr>`).join('')}</tbody></table>
    `;
    openModal(`Billing Period — ${period.label}`, body, '', { wide: true });
  } catch (err) { toast(err.message, true); }
};

// The composer always starts from the saved default (Settings > Auto
// Emails' "Store Billing: Billing Period Request" entry, same generic
// system-email-template mechanism every other automatic email in this app
// uses) rather than a hardcoded constant — editing and saving that default
// (here via "Save as Default", or directly in Settings) is what makes a
// wording change stick for every future billing period instead of
// resetting the next time this composer opens. Each individual send can
// still be tweaked ad hoc without touching the saved default at all.
window.openIssueBillingModal = async () => {
  const today = new Date().toISOString().slice(0, 10);
  let subject = 'Please submit your invoice — {{period}}', bodyHtml = '';
  try {
    const { templates } = await api('/settings/email-templates');
    const tmpl = templates.find(t => t.key === 'storeBillingRequest');
    if (tmpl) { subject = tmpl.subject; bodyHtml = tmpl.body; }
  } catch { /* fall back to the inline defaults above if Settings can't be reached */ }
  const body = `
    <div class="grid-2">
      <div><label>Billing Period Start</label><input id="ib-start" type="date" value="${today}"></div>
      <div><label>Billing Period End</label><input id="ib-end" type="date" value="${today}"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><label style="margin:0">Email Subject</label>${fieldMenu('ib-subject', BILLING_REQUEST_FIELDS)}</div>
    <input id="ib-subject" value="${esc(subject)}" style="margin-top:4px">
    <label>Email Message <span class="small-muted">(the pills are filled in for each store when it sends)</span></label>
    <div id="ib-rte"></div>
    <p class="small-muted" style="margin-top:6px">Changes here apply to this send only. Use "Save as Default" to make them permanent for every future billing period.</p>
  `;
  openModal('Issue Billing Email', body, `
    <button class="btn btn-outline btn-sm" onclick="saveBillingEmailDefault()">Save as Default</button>
    <button class="btn btn-primary btn-sm" onclick="openStorePicker()">Next: Choose Stores</button>`, { wide: true });
  ibEditor = createRichTextEditor('ib-rte', bodyHtml, { fields: BILLING_REQUEST_FIELDS });
};

// Fields filled in per store when a billing request goes out.
const BILLING_REQUEST_FIELDS = [
  { key: 'storeName', label: 'Store name' }, { key: 'period', label: 'Billing period' },
  { key: 'startDate', label: 'Period start' }, { key: 'endDate', label: 'Period end' }, { key: 'portalUrl', label: 'Portal link' },
];
let ibEditor = null;
// A tiny "Insert field…" menu for a plain text input (the subject line): the
// subject is text-only, so it gets the {{field}} token inserted at the cursor.
function fieldMenu(inputId, fields) {
  return `<select class="btn-sm" style="width:auto;font-size:12.5px;padding:4px 8px" onchange="insertIntoInput('${inputId}', this.value); this.value=''"><option value="">Insert field&hellip;</option>${fields.map(f => `<option value="${esc(f.key)}">${esc(f.label)}</option>`).join('')}</select>`;
}
window.insertIntoInput = (inputId, key) => {
  if (!key) return;
  const el = qs('#' + inputId); const tok = `{{${key}}}`;
  const a = el.selectionStart ?? el.value.length, z = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0, a) + tok + el.value.slice(z); el.focus(); el.setSelectionRange(a + tok.length, a + tok.length);
};

window.saveBillingEmailDefault = async () => {
  try {
    await api('/settings/email-templates/storeBillingRequest', { method: 'PUT', body: { subject: qs('#ib-subject').value, body: ibEditor.getHtml() } });
    toast('Saved as the default billing email — every future "Issue Billing Email" will start from this.');
  } catch (err) { toast(err.message, true); }
};

window.openStorePicker = async () => {
  const start = qs('#ib-start').value, end = qs('#ib-end').value, subject = qs('#ib-subject').value, bodyHtml = ibEditor.getHtml();
  if (!start || !end) return toast('Start and end date are required', true);
  if (!subject || !bodyHtml.replace(/<[^>]*>|&nbsp;|\s/g, '')) return toast('Subject and body are required', true);
  try {
    const { stores } = await api('/stores?setup_status=active');
    const body = `
      <p class="small-muted">Only approved stores are listed. Select who should get this request.</p>
      <div style="margin-bottom:8px"><input id="sp-search" placeholder="Search stores&hellip;" oninput="filterStorePicker()">
        <label class="checkbox-row" style="margin-top:8px"><input type="checkbox" id="sp-all" onchange="toggleAllStores(this.checked)"><span>Select All</span></label>
      </div>
      <div class="sb-store-picker" id="sp-list">${stores.map(s => `<div class="sb-store-row" data-name="${esc(s.name.toLowerCase())}"><input type="checkbox" class="sp-store" value="${s.id}"><span>${esc(s.name)}</span></div>`).join('') || '<p class="small-muted">No approved stores found.</p>'}</div>
    `;
    openModal('Choose Stores', body, `<button class="btn btn-primary btn-sm" onclick="sendBillingEmail('${esc(start)}','${esc(end)}')">Send</button>`, { wide: true });
    window._ibSubject = subject; window._ibBody = bodyHtml;
  } catch (err) { toast(err.message, true); }
};
window.filterStorePicker = () => {
  const q = qs('#sp-search').value.toLowerCase();
  qsa('.sb-store-row').forEach(r => r.style.display = r.dataset.name.includes(q) ? '' : 'none');
};
window.toggleAllStores = (checked) => {
  qsa('.sp-store').forEach(cb => { if (cb.closest('.sb-store-row').style.display !== 'none') cb.checked = checked; });
};

window.sendBillingEmail = async (start, end) => {
  const storeIds = qsa('.sp-store:checked').map(cb => cb.value);
  if (!storeIds.length) return toast('Select at least one store', true);
  try {
    const r = await api('/store-billing/periods', { method: 'POST', body: { start_date: start, end_date: end, email_subject: window._ibSubject, email_body: window._ibBody, store_ids: storeIds } });
    toast(`Sent to ${r.sent} store(s)${r.failed ? `, ${r.failed} failed` : ''}${r.skipped ? `, ${r.skipped} skipped` : ''}`);
    closeModal();
    loadPeriods();
  } catch (err) { toast(err.message, true); }
};

// ===================== Payment Emails (templates) =====================

let payTemplates = [], payVars = [], ptEditor = null;
async function loadPaymentTemplates() {
  try {
    const r = await api('/store-billing/payment-email-templates');
    payTemplates = r.templates; payVars = r.vars;
    qs('#pt-list').innerHTML = payTemplates.map(t => `
      <div class="card" style="margin-bottom:12px">
        <div class="flex-between" style="gap:10px;flex-wrap:wrap">
          <div><strong style="font-size:15px">${esc(t.name)}</strong> ${t.is_default ? badge('default', 'active') : ''}
            <div class="small-muted" style="margin-top:2px">Subject: ${renderFieldChips(esc(t.subject), payVars)}</div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${canEdit ? `<button class="btn btn-outline btn-sm" onclick="openPaymentTemplate('${t.id}')">Edit</button>` : ''}
            ${canEdit && !t.is_default ? `<button class="btn btn-outline btn-sm" onclick="setDefaultPaymentTemplate('${t.id}')">Set as Default</button>` : ''}
            ${canEdit && !t.is_default ? `<button class="btn btn-outline btn-sm" style="color:#b71c1c;border-color:#b71c1c" onclick="deletePaymentTemplate('${t.id}')">Delete</button>` : ''}
          </div>
        </div>
        <div class="pt-preview" style="margin-top:10px;max-height:170px;overflow:hidden;border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:#fff;font-size:13.5px;position:relative">
          ${renderFieldChips(t.body_html, payVars)}
          <div style="position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,#fff)"></div>
        </div>
      </div>`).join('');
  } catch (err) { toast(err.message, true); }
}
window.openPaymentTemplate = (id) => {
  const t = id ? payTemplates.find(x => x.id === id) : null;
  const body = `
    <label>Template Name</label><input id="pt-name" value="${esc(t?.name || '')}" placeholder="e.g. Standard payment notice">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><label style="margin:0">Subject</label>${fieldMenu('pt-subject', payVars)}</div>
    <input id="pt-subject" style="margin-top:4px" value="${esc(t?.subject || 'Payment sent — {{period}}')}">
    <label>Message <span class="small-muted">(use <strong>Insert field</strong> to add the invoice breakdown table &mdash; invoice amount, minus the processing fee, total &mdash; or any single figure)</span></label>
    <div id="pt-rte"></div>
    <label class="checkbox-row" style="margin-top:14px"><input type="checkbox" id="pt-default" ${t?.is_default ? 'checked disabled' : ''}><span>Make this the default template${t?.is_default ? ' <span class="small-muted">(it already is)</span>' : ''}</span></label>
  `;
  openModal(t ? 'Edit Payment Email' : 'New Payment Email', body, `<button class="btn btn-primary btn-sm" onclick="savePaymentTemplate('${id || ''}')">Save</button>`, { wide: true });
  ptEditor = createRichTextEditor('pt-rte', t?.body_html || '<p>Shalom {{storeName}},</p><p>Your payment has been sent.</p><p>{{breakdown}}</p>', { fields: payVars });
};
window.savePaymentTemplate = async (id) => {
  const body = { name: qs('#pt-name').value, subject: qs('#pt-subject').value, body_html: ptEditor.getHtml(), is_default: qs('#pt-default').checked || undefined };
  try {
    if (id) await api(`/store-billing/payment-email-templates/${id}`, { method: 'PUT', body });
    else await api('/store-billing/payment-email-templates', { method: 'POST', body });
    toast('Template saved'); closeModal(); loadPaymentTemplates();
  } catch (err) { toast(err.message, true); }
};
window.setDefaultPaymentTemplate = async (id) => {
  try { await api(`/store-billing/payment-email-templates/${id}/default`, { method: 'POST' }); toast('Default template changed'); loadPaymentTemplates(); } catch (err) { toast(err.message, true); }
};
window.deletePaymentTemplate = async (id) => {
  const t = payTemplates.find(x => x.id === id);
  if (!confirm(`Delete the template "${t?.name}"?`)) return;
  try { await api(`/store-billing/payment-email-templates/${id}`, { method: 'DELETE' }); toast('Template deleted'); loadPaymentTemplates(); } catch (err) { toast(err.message, true); }
};

loadInvoices();
</script>
</body>
</html>
