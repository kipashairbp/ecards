<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Center · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
renderShell('/admin/sms', `
  <div class="flex-between"><h2>SMS Center</h2><div class="pill-row"><button class="btn btn-outline btn-sm" id="btn-broadcast">Broadcast to a Group</button><button class="btn btn-primary btn-sm" id="btn-compose">Send Message</button></div></div>
  <div id="mock-banner"></div>
  <div class="tabs" id="stabs">
    <button class="active" data-t="chats">Chats</button>
    <button data-t="sent">Sent Messages</button>
    <button data-t="inbox">Inbox</button>
    <button data-t="templates">Templates</button>
  </div>

  <div id="panel-chats">
    <p class="small-muted">Every message, in one 2-way conversation per phone number. Reply right from here — it sends a real text.</p>
    <div style="display:flex;gap:16px;height:70vh;min-height:420px">
      <div class="card" style="width:300px;flex-shrink:0;padding:0;overflow-y:auto" id="chat-thread-list"><div class="small-muted" style="padding:16px">Loading…</div></div>
      <div class="card" style="flex:1;display:flex;flex-direction:column;padding:0;overflow:hidden" id="chat-conversation"><div class="small-muted" style="padding:40px;text-align:center">Select a conversation</div></div>
    </div>
  </div>

  <div id="panel-sent" style="display:none">
    <div class="toolbar">
      <input id="f-search" placeholder="Search phone or message…">
      <select id="f-status"><option value="">All statuses</option><option value="sent">Sent</option><option value="failed">Failed</option><option value="mock">Mock (no provider)</option></select>
      <select id="f-season"></select>
      <select id="f-pagesize"><option value="25">25 / page</option><option value="50">50 / page</option><option value="100">100 / page</option><option value="200">200 / page</option></select>
      <button class="btn btn-outline btn-sm" id="btn-export">Export Excel</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Phone</th><th>Account</th><th>Message</th><th>Status</th><th>Sent By</th><th>Sent</th></tr></thead>
      <tbody id="tbody-sent"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
    <div class="paginator" id="pager-sent"></div>
  </div>

  <div id="panel-inbox" style="display:none">
    <p class="small-muted">SimpleSender doesn't support inbound webhooks yet, so incoming messages are pulled by checking in every 15 minutes automatically. <button type="button" class="btn btn-sm btn-outline" id="btn-sync-inbox" style="margin-left:4px">Check Now</button></p>
    <p class="small-muted">If your provider adds webhooks later, this Inbox is also ready to receive them directly at:</p>
    <p><code id="webhook-url" style="user-select:all"></code></p>
    <div class="toolbar"><select id="f-inbox-pagesize"><option value="25">25 / page</option><option value="50">50 / page</option><option value="100">100 / page</option><option value="200">200 / page</option></select></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>From</th><th>Account</th><th>Message</th><th>Received</th></tr></thead>
      <tbody id="tbody-inbox"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
    <div class="paginator" id="pager-inbox"></div>
  </div>

  <div id="panel-templates" style="display:none">
    <div class="flex-between"><p class="small-muted">Reusable SMS templates. Use <code>{{variable}}</code> placeholders in the message.</p><button class="btn btn-outline btn-sm" id="btn-new-template">+ New Template</button></div>
    <div id="templates-list"><p class="small-muted">Loading…</p></div>
  </div>
`);

function showSmsTab(t) {
  qsa('#stabs button').forEach(b => { b.classList.toggle('active', b.dataset.t === t); });
  ['chats','sent','inbox','templates'].forEach(p => qs('#panel-'+p).style.display = p === t ? 'block' : 'none');
  if (t === 'sent') loadSent();
  if (t === 'templates') loadTemplates();
  if (t === 'inbox') { loadInbox(); document.getElementById('sms-floating-notice')?.remove(); api('/sms/inbox/mark-seen', { method: 'POST' }).catch(() => {}); }
  if (t === 'chats') loadChatThreads();
}
qsa('#stabs button').forEach(b => b.addEventListener('click', () => showSmsTab(b.dataset.t)));

qs('#btn-sync-inbox').addEventListener('click', async () => {
  const btn = qs('#btn-sync-inbox'); btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const r = await api('/sms/inbox/sync', { method: 'POST' });
    if (r.mockMode) { toast('SMS isn\'t turned on yet — nothing to check.', true); }
    else {
      toast(`Found ${r.imported} new message(s) (${r.skipped} not classified as inbound, ${r.total} total on the provider)`);
      renderSyncDiagnostics(r);
    }
    loadInbox();
  } catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Check Now'; }
});

// Shows exactly what SimpleSender's /v1/messages endpoint actually returned
// when we can't make sense of it, so figuring out real field names doesn't
// require Render server-log access — the raw shape is visible right here.
function renderSyncDiagnostics(r) {
  let box = qs('#sync-diagnostics');
  if (!r.sample && !r.rawKeys) { if (box) box.remove(); return; }
  if (!box) {
    box = document.createElement('div');
    box.id = 'sync-diagnostics';
    box.className = 'card';
    box.style.cssText = 'border-color:var(--warn);margin:12px 0';
    qs('#panel-inbox').insertBefore(box, qs('#panel-inbox').firstChild.nextSibling);
  }
  if (r.rawKeys) {
    box.innerHTML = `<strong>Couldn't find a message list in the provider's response.</strong>
      <p class="small-muted" style="margin-top:6px">Expected a <code>messages</code> array but the response only has these top-level fields: <code>${esc(r.rawKeys.join(', '))}</code>. Share this with support to fix the sync.</p>`;
  } else {
    box.innerHTML = `<strong>Found messages, but couldn't tell which ones are incoming.</strong>
      <p class="small-muted" style="margin-top:6px">None of the ${r.skipped} message(s) checked had a recognizable direction field. Here's a sample message as the provider sent it — share this with support to fix the sync:</p>
      <pre style="white-space:pre-wrap;word-break:break-all;background:var(--bg-alt,#f6f6f6);padding:10px;border-radius:6px;font-size:12px;margin-top:6px">${esc(JSON.stringify(r.sample, null, 2))}</pre>`;
  }
}

// ============================= Chats (2-way threads) =============================
let activeChatPhone = null;
async function loadChatThreads() {
  try {
    const { threads } = await api('/sms/threads');
    qs('#chat-thread-list').innerHTML = threads.length ? threads.map(t => `
      <div class="chat-thread-row" style="padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;${t.phone === activeChatPhone ? 'background:var(--bg-alt,#f3f3f3)' : ''}" onclick="openChatThread('${esc(t.phone)}')">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px">
          <strong style="${t.unread ? '' : 'font-weight:600'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.account?.label || t.phone)}</strong>
          ${t.unread ? `<span class="badge badge-active">${t.unread}</span>` : ''}
        </div>
        <div class="small-muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${t.unread ? '700' : '400'}">${t.last_direction === 'outbound' ? 'You: ' : ''}${esc(t.last_body || '')}</div>
        <div class="small-muted" style="font-size:11px">${fmtDateTime(t.last_at)}</div>
      </div>`).join('') : '<div class="small-muted" style="padding:16px">No messages yet.</div>';
  } catch (err) { toast(err.message, true); }
}
window.openChatThread = async (phone) => {
  activeChatPhone = phone;
  loadChatThreads();
  try {
    const { messages, account } = await api(`/sms/threads/${encodeURIComponent(phone)}`);
    qs('#chat-conversation').innerHTML = `
      <div style="padding:12px 16px;border-bottom:1px solid var(--border)"><strong>${esc(account?.label || phone)}</strong><div class="small-muted">${esc(phone)}</div></div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px">
        ${messages.length ? messages.map(m => `<div style="align-self:${m.direction==='outbound'?'flex-end':'flex-start'};max-width:70%">
            <div style="background:${m.direction==='outbound'?'var(--brand-gold-dark,#c9a76a)':'var(--bg-alt,#eee)'};color:${m.direction==='outbound'?'#241a15':'#222'};padding:8px 12px;border-radius:12px">${esc(m.body||'')}</div>
            <div class="small-muted" style="font-size:11px;margin-top:2px;text-align:${m.direction==='outbound'?'right':'left'}">${fmtDateTime(m.created_at)}${m.sent_by_name ? ' · ' + esc(m.sent_by_name) : ''}${m.status==='failed' ? ' · <span style="color:var(--danger)">failed</span>' : ''}</div>
          </div>`).join('') : '<div class="small-muted">No messages with this number yet.</div>'}
      </div>
      <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)">
        <input id="chat-reply-input" placeholder="Type a reply…" style="flex:1">
        <button class="btn btn-primary btn-sm" id="btn-chat-send">Send</button>
      </div>
    `;
    const msgsEl = qs('#chat-messages');
    if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
    qs('#chat-reply-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatReply(phone); });
    qs('#btn-chat-send').addEventListener('click', () => sendChatReply(phone));
    document.getElementById('sms-floating-notice')?.remove();
    api('/sms/inbox/mark-seen', { method: 'POST' }).then(loadChatThreads).catch(() => {});
  } catch (err) { toast(err.message, true); }
};
window.sendChatReply = async (phone) => {
  const input = qs('#chat-reply-input');
  const body = input.value.trim();
  if (!body) return;
  const btn = qs('#btn-chat-send');
  input.disabled = true; if (btn) btn.disabled = true;
  try {
    await api('/sms/send', { method: 'POST', body: { to: phone, body } });
    input.value = '';
    openChatThread(phone);
  } catch (err) { toast(err.message, true); input.disabled = false; if (btn) btn.disabled = false; }
};

qs('#webhook-url').textContent = window.location.origin + '/api/sms/webhook/inbound';

api('/sms/config').then(({ mockMode }) => {
  if (mockMode) qs('#mock-banner').innerHTML = `<div class="card" style="border-color:var(--warn);margin-bottom:16px">
    <strong>SMS isn't turned on yet — messages are only being logged here, not actually sent.</strong>
    <p class="small-muted" style="margin-top:8px">To activate it:</p>
    <ol class="small-muted" style="margin:4px 0 0;padding-left:20px;line-height:1.7">
      <li>Log into your SimpleSender account and go to <strong>Developer &gt; Docs &amp; Keys</strong> to get your Base URL and API Key.</li>
      <li>Go to your Render dashboard &gt; this service &gt; <strong>Environment</strong>, and add two variables: <code>SMS_API_BASE</code> (the base URL) and <code>SMS_API_KEY</code> (the API key).</li>
      <li>Render will redeploy automatically once those are saved — after that, this banner disappears and messages send for real.</li>
    </ol>
  </div>`;
}).catch(() => {});

let state = { search: '', status: '', season_id: '', page: 1, pageSize: Auth.pageSize('sms') };
async function loadSent() {
  const params = new URLSearchParams(Object.fromEntries(Object.entries({ ...state, direction: 'outbound' }).filter(([,v]) => v !== '')));
  try {
    const { messages, total } = await api('/sms?' + params);
    qs('#tbody-sent').innerHTML = messages.length ? messages.map(sentRowHtml).join('') : '<tr><td colspan="4" class="empty-state">No messages sent yet.</td></tr>';
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    qs('#pager-sent').innerHTML = `<button class="btn btn-sm btn-outline" ${state.page<=1?'disabled':''} onclick="changePage(-1)">Prev</button> Page ${state.page} of ${pages} (${total} total) <button class="btn btn-sm btn-outline" ${state.page>=pages?'disabled':''} onclick="changePage(1)">Next</button>`;
  } catch (err) { toast(err.message, true); }
}
function changePage(d) { state.page += d; loadSent(); }
// Resolves phone -> linked account (shul/store/applicant/staff), computed
// server-side per row since it's a live lookup, not a stored field.
const ACCOUNT_TYPE_LABEL = { shul: 'Shul', store: 'Store', applicant: 'Applicant', user: 'Admin' };
function accountCellHtml(account) {
  if (!account) return '<span class="small-muted">&mdash;</span>';
  return `${esc(ACCOUNT_TYPE_LABEL[account.type] || account.type)}: ${esc(account.label)}`;
}
function sentRowHtml(m) {
  const statusCls = m.status === 'sent' ? 'active' : (m.status === 'failed' ? 'rejected' : 'pending');
  const statusLabel = m.status === 'mock' ? 'mock' : m.status;
  return `<tr><td>${esc(m.phone)}</td><td>${accountCellHtml(m.account)}</td><td>${esc(m.body || '')}</td><td>${badge(statusLabel, statusCls)}</td><td>${m.sent_by_name ? esc(m.sent_by_name) : '<span class="small-muted">System</span>'}</td><td>${fmtDateTime(m.created_at)}</td></tr>`;
}
qs('#f-search').addEventListener('input', debounce(() => { state.search = qs('#f-search').value; state.page = 1; loadSent(); }, 350));
qs('#f-status').addEventListener('change', () => { state.status = qs('#f-status').value; state.page = 1; loadSent(); });
qs('#f-season').addEventListener('change', () => { state.season_id = qs('#f-season').value; state.page = 1; loadSent(); loadInbox(); });
qs('#f-pagesize').value = state.pageSize;
qs('#f-pagesize').addEventListener('change', () => { state.pageSize = +qs('#f-pagesize').value; state.page = 1; Auth.savePageSize('sms', state.pageSize); loadSent(); });
qs('#btn-export').addEventListener('click', () => downloadAuthed('/sms/export' + (state.season_id ? `?season_id=${state.season_id}` : ''), 'sms-messages.xlsx'));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

let inboxState = { page: 1, pageSize: Auth.pageSize('sms_inbox') };
async function loadInbox() {
  const params = new URLSearchParams({ direction: 'inbound', page: inboxState.page, pageSize: inboxState.pageSize, ...(state.season_id ? { season_id: state.season_id } : {}) });
  try {
    const { messages, total } = await api('/sms?' + params);
    qs('#tbody-inbox').innerHTML = messages.length ? messages.map(m => `<tr><td>${esc(m.phone)}</td><td>${accountCellHtml(m.account)}</td><td>${esc(m.body || '')}</td><td>${fmtDateTime(m.created_at)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">No incoming messages yet.</td></tr>';
    const pages = Math.max(1, Math.ceil(total / inboxState.pageSize));
    qs('#pager-inbox').innerHTML = `<button class="btn btn-sm btn-outline" ${inboxState.page<=1?'disabled':''} onclick="changeInboxPage(-1)">Prev</button> Page ${inboxState.page} of ${pages} (${total} total) <button class="btn btn-sm btn-outline" ${inboxState.page>=pages?'disabled':''} onclick="changeInboxPage(1)">Next</button>`;
  } catch (err) { toast(err.message, true); }
}
function changeInboxPage(d) { inboxState.page += d; loadInbox(); }
qs('#f-inbox-pagesize').value = inboxState.pageSize;
qs('#f-inbox-pagesize').addEventListener('change', () => { inboxState.pageSize = +qs('#f-inbox-pagesize').value; inboxState.page = 1; Auth.savePageSize('sms_inbox', inboxState.pageSize); loadInbox(); });

let templatesCache = [];
async function loadTemplates() {
  try {
    const { templates } = await api('/sms/templates/all');
    templatesCache = templates;
    qs('#templates-list').innerHTML = templates.length ? templates.map(t => `<div class="card" style="margin-bottom:10px">
        <div class="flex-between"><strong>${esc(t.name)}</strong>${t.category ? `<span class="small-muted">${esc(t.category)}</span>` : ''}</div>
        <p class="small-muted">${esc(t.body)}</p>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-sm btn-outline" onclick="editTemplate('${t.id}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTemplate('${t.id}')">Delete</button>
        </div>
      </div>`).join('') : '<p class="small-muted">No templates yet.</p>';
  } catch (err) { toast(err.message, true); }
}
// Same variable names ENTITY_TEMPLATE_VARS (app.js) fills in automatically
// when this template is picked from an applicant or shul profile's quick-send
// box — shown here so admins know what to type while building the template,
// without having to go find a profile first to check.
function availableVarsHint() {
  return `<p class="small-muted" style="margin-top:6px">
    <strong>When sent from an applicant profile:</strong> ${ENTITY_TEMPLATE_VARS.applicant.map(([k,l]) => `<code title="${esc(l)}">{{${k}}}</code>`).join(' ')}<br>
    <strong>When sent from a shul profile:</strong> ${ENTITY_TEMPLATE_VARS.shul.map(([k,l]) => `<code title="${esc(l)}">{{${k}}}</code>`).join(' ')}
  </p>`;
}
function templateFormBody(t = {}) {
  return `
    <label>Name <span class="req">*</span></label><input id="tp-name" value="${esc(t.name||'')}">
    <label>Category <span class="small-muted">(optional)</span></label><input id="tp-category" value="${esc(t.category||'')}">
    <label>Message <span class="req">*</span> <span class="small-muted">(use {{variable}} placeholders as needed)</span></label>
    <textarea id="tp-body" rows="5">${esc(t.body||'')}</textarea>
    ${availableVarsHint()}
  `;
}
qs('#btn-new-template').addEventListener('click', () => {
  openModal('New Template', templateFormBody(), `<button class="btn btn-primary btn-sm" onclick="createTemplate()">Create</button>`);
});
window.createTemplate = async () => {
  const body = { name: qs('#tp-name').value.trim(), category: qs('#tp-category').value.trim(), body: qs('#tp-body').value };
  if (!body.name || !body.body) return toast('Name and message are required', true);
  try { await api('/sms/templates', { method: 'POST', body }); toast('Template created'); closeModal(); loadTemplates(); } catch (err) { toast(err.message, true); }
};
window.editTemplate = (id) => {
  const t = templatesCache.find(x => x.id === id);
  if (!t) return;
  openModal('Edit Template', templateFormBody(t), `<button class="btn btn-danger btn-sm" onclick="deleteTemplate('${id}')">Delete</button><button class="btn btn-primary btn-sm" onclick="saveTemplate('${id}')">Save</button>`);
};
window.saveTemplate = async (id) => {
  const body = { name: qs('#tp-name').value.trim(), category: qs('#tp-category').value.trim(), body: qs('#tp-body').value };
  try { await api(`/sms/templates/${id}`, { method: 'PUT', body }); toast('Saved'); closeModal(); loadTemplates(); } catch (err) { toast(err.message, true); }
};
window.deleteTemplate = async (id) => {
  if (!confirm('Delete this template?')) return;
  try { await api(`/sms/templates/${id}`, { method: 'DELETE' }); closeModal(); loadTemplates(); } catch (err) { toast(err.message, true); }
};

let seasonsCache = [];
qs('#btn-broadcast').addEventListener('click', () => openBroadcastByFilterModal('sms'));
qs('#btn-compose').addEventListener('click', async () => {
  if (!templatesCache.length) { try { ({ templates: templatesCache } = await api('/sms/templates/all')); } catch { /* compose still works without templates */ } }
  if (!seasonsCache.length) { try { ({ seasons: seasonsCache } = await api('/seasons')); } catch { /* group sends just fall back to the active season */ } }
  const tmplOptions = `<option value="">Start from scratch</option>` + templatesCache.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const seasonOptions = seasonsCache.map(s => `<option value="${s.id}" ${s.id === state.season_id ? 'selected' : ''}>${esc(s.name)}${s.is_active ? ' (active)' : ''}</option>`).join('');
  const body = `
    <label>Send To</label>
    <select id="cp-mode">
      <option value="single">A specific phone number</option>
      <option value="shuls">Group: All Shuls (Gabai cell)</option>
      <option value="stores">Group: All Stores (manager/owner phone)</option>
      <option value="applicants">Group: All Applicants</option>
      <option value="staff">Group: All Admins (with phone on file)</option>
    </select>
    <div id="cp-single-wrap"><label>Phone Number <span class="req">*</span> <span class="small-muted">(comma-separate multiple numbers)</span></label><input id="cp-to" placeholder="+15555550123, +15555550124"></div>
    <div id="cp-season-wrap" style="display:none"><label>Season <span class="small-muted">(a shul/applicant is a fresh record every season)</span></label><select id="cp-season">${seasonOptions}</select></div>
    <label>Use Template</label><select id="cp-template">${tmplOptions}</select>
    <label>Message <span class="req">*</span></label><textarea id="cp-body" rows="5"></textarea>
  `;
  openModal('Send SMS', body, `<button class="btn btn-primary btn-sm" onclick="sendComposedSms()">Send</button>`);
  qs('#cp-mode').addEventListener('change', () => {
    const mode = qs('#cp-mode').value;
    qs('#cp-single-wrap').style.display = mode === 'single' ? 'block' : 'none';
    qs('#cp-season-wrap').style.display = (mode === 'shuls' || mode === 'applicants') ? 'block' : 'none';
  });
  qs('#cp-template').addEventListener('change', () => {
    const t = templatesCache.find(x => x.id === qs('#cp-template').value);
    qs('#cp-body').value = t ? t.body : '';
  });
});
window.sendComposedSms = async () => {
  const mode = qs('#cp-mode').value;
  const messageBody = qs('#cp-body').value;
  if (!messageBody) return toast('Message is required', true);
  const payload = { body: messageBody };
  if (mode === 'single') {
    const to = qs('#cp-to').value.trim();
    if (!to) return toast('Enter a phone number', true);
    payload.to = to;
  } else {
    payload.group = mode;
    if (mode === 'shuls' || mode === 'applicants') payload.season_id = qs('#cp-season').value;
  }
  try {
    const r = await api('/sms/send', { method: 'POST', body: payload });
    // 'single' mode can now be one or several comma-separated numbers — same
    // response shape either way (POST /sms/send always returns
    // sent/failed/total), so one message covers both: a lone recipient
    // reads naturally as "Sent to 1 of 1 recipient(s)".
    toast(`Sent to ${r.sent} of ${r.total} recipient(s)${r.failed ? `, ${r.failed} failed` : ''}`, !!r.failed && r.sent === 0);
    closeModal(); loadSent();
  } catch (err) { toast(err.message, true); }
};

// Deliberately not calling loadSent()/showSmsTab('sent') before the season
// filter resolves — an unscoped first call here would flash every season's
// messages for a moment before the season-scoped one replaced it (same
// race shape #5 fixed for the Applicants list's load()). Chats/Inbox aren't
// season-scoped, so they're safe to open immediately.
const startParams = new URLSearchParams(location.search);
const startTab = startParams.get('tab');
const startPhone = startParams.get('phone');
if (startTab === 'inbox') showSmsTab('inbox');
else { showSmsTab('chats'); if (startPhone) openChatThread(startPhone); }
populateSeasonFilter('f-season').then(activeId => { state.season_id = activeId; });
</script>
</body>
</html>
