<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
  body { background: var(--brand-bg); display:flex; flex-direction:column; min-height:100vh; }
  .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
  .login-box { width: 380px; }
  .login-box .brand-mark { height: 64px; margin-bottom: 18px; }
  .login-box h1 { color:#fdf7ea; text-align:center; font-size: 22px; }
</style>
</head>
<body>
<div class="login-wrap">
<div class="login-box">
  <img class="brand-mark" src="/img/org-logo.png" alt="Organization logo">
  <h1>Kipas Hair BP Platform</h1>
  <div class="card">
    <form id="login-form">
      <label>Email</label><input type="email" name="email" required autofocus>
      <label>Password</label><input type="password" name="password" required>
      <div style="margin-top:20px"><button class="btn btn-primary" style="width:100%">Sign In</button></div>
    </form>
    <p class="small-muted" style="text-align:center;margin-top:14px"><a href="/forgot-password">Forgot password?</a></p>
  </div>
</div>
</div>
<script src="/js/app.js"></script>
<script>api('/orgs/resolve').then(({ org }) => applyOrgTheme(org)).catch(() => {});</script>
<script>trackPageview();</script>
<script>renderPublicFooter();</script>
<script>
qs('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  try {
    const { token, user, permissions } = await api('/auth/login', { method: 'POST', body: data });
    Auth.set(token, user, permissions);
    if (user.role === 'shul') location.href = '/shul-portal/dashboard';
    else if (user.role === 'store') location.href = await storeLandingUrl(user);
    else location.href = '/admin/dashboard';
  } catch (err) { toast(err.message, true); }
});
</script>
</body>
</html>
