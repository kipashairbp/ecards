<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
<style>
  #billing-root { opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; }
  #billing-root.bw-in { opacity: 1; transform: translateY(0); }
  .bw-card { max-width: 620px; margin: 0 auto; text-align: center; }
  .bw-card.bw-wide { max-width: 760px; text-align: left; }
  .bw-icon { font-size: 40px; line-height: 1; margin-bottom: 6px; }
  .bw-steps-preview { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
  .bw-step-chip { padding: 7px 14px; border-radius: 999px; background: var(--brand-panel-2); color: var(--text-muted); font-size: 12.5px; font-weight: 600; border: 1.5px solid var(--border); }
  .bw-step-chip.active { background: var(--brand-gold); color: var(--text-dark); border-color: var(--brand-gold); }
  .bw-step-chip.done { background: var(--success); color: #fff; border-color: var(--success); }
  .code-boxes { display: flex; justify-content: center; gap: 8px; margin: 22px 0 10px; flex-wrap: wrap; }
  .code-box { width: 38px; height: 48px; text-align: center; font-size: 22px; font-weight: 700; padding: 0; }
  .code-box.filled { border-color: var(--brand-gold-dark); box-shadow: 0 0 0 3px rgba(37,169,234,.18); }
  .bw-shake { animation: bwShake .4s; }
  @keyframes bwShake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .bank-picker { position: relative; }
  .bank-dropdown { position: absolute; z-index: 20; top: 100%; left: 0; right: 0; background: var(--brand-panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; margin-top: 4px; }
  .bank-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; font-size: 14px; text-align: left; }
  .bank-item:hover { background: var(--brand-panel-2); }
  .bank-selected-pill { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--brand-gold-dark); border-radius: 8px; margin-top: 6px; background: var(--brand-panel-2); }
  .bank-selected-pill button { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .bank-logo { flex-shrink: 0; }
  .bw-grid-3 { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 0 16px; }
  @media (max-width: 640px) { .bw-grid-3 { grid-template-columns: 1fr; } }
  .bw-period-banner { background: linear-gradient(135deg, var(--brand-bg), var(--brand-bg-2)); color: var(--text-on-dark); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bw-period-banner strong { color: var(--brand-gold-light); }
  .bw-tax-note { background: var(--brand-panel-2); border-left: 3px solid var(--brand-gold); border-radius: 6px; padding: 10px 14px; font-size: 13px; color: var(--text-body); margin: 10px 0 16px; }
  .bw-success { text-align: center; max-width: 480px; margin: 20px auto; }
  .bw-checkmark { width: 86px; height: 86px; border-radius: 50%; background: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; animation: bwPop .4s cubic-bezier(.26,1.36,.52,1); }
  @keyframes bwPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .bw-checkmark svg { width: 44px; height: 44px; }
  .bw-checkmark path { stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 48; stroke-dashoffset: 48; animation: bwDraw .5s .3s forwards ease-out; }
  @keyframes bwDraw { to { stroke-dashoffset: 0; } }
  .bw-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: bwSpin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes bwSpin { to { transform: rotate(360deg); } }
  .bw-file-drop { border: 2px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
  .bw-file-drop:hover, .bw-file-drop.drag { border-color: var(--brand-gold-dark); background: var(--brand-panel-2); }
  .bw-file-drop input { display: none; }
  .bw-attachment-name { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--text-body); }
</style>
</head>
<body>
<script src="/js/app.js"></script>
<script src="/js/usbanks.js"></script>
<script>
Auth.requireRole('store');
renderShell('/store-portal/billing', `<div id="billing-root"><p class="small-muted">Loading&hellip;</p></div>`);
const u = Auth.user();

const BW = {
  status: null,
  view: 'loading',
  sentTo: '',
  verifyPurpose: null,
  verificationId: null,
  selectedBank: null,
  bills: [],
  submitting: false,
};

function paint(html) {
  const root = qs('#billing-root');
  root.classList.remove('bw-in');
  root.innerHTML = html;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('bw-in')));
}

async function refreshStatus() {
  BW.status = await api('/store-billing/my/status');
}

async function boot() {
  try {
    await refreshStatus();
    if (!BW.status.hasPaymentInfo) { BW.view = 'need_setup'; }
    else { BW.view = 'main'; await loadBills(); }
    render();
  } catch (err) { paint(`<p class="small-muted">${esc(err.message)}</p>`); }
}

async function loadBills() {
  const { bills } = await api('/store-billing/my/invoices');
  BW.bills = bills;
}

function render() {
  if (BW.view === 'need_setup') return paint(viewNeedSetup());
  if (BW.view === 'verify_send') return paint(viewVerifySend());
  if (BW.view === 'verify_code') return paint(viewVerifyCode());
  if (BW.view === 'payment_form') return paint(viewPaymentForm());
  if (BW.view === 'main') return paint(viewMain());
  if (BW.view === 'invoice_form') return paint(viewInvoiceForm());
  if (BW.view === 'invoice_success') return paint(viewInvoiceSuccess());
  return paint('<p class="small-muted">Loading&hellip;</p>');
}

// ===================== Views =====================

function viewNeedSetup() {
  return `
  <div class="card bw-card">
    <div class="bw-icon">&#127974;</div>
    <h2>Set Up Billing</h2>
    <p>Before you can submit your first invoice, we need your payment information on file so we know exactly where to send your reimbursement.</p>
    <div class="bw-steps-preview">
      <div class="bw-step-chip active">1. Verify Your Email</div>
      <div class="bw-step-chip">2. Payment Info</div>
      <div class="bw-step-chip">3. Submit Invoices</div>
    </div>
    <button class="btn btn-primary" onclick="BW.startVerify('payment_info')">Get Started</button>
  </div>`;
}

function viewVerifySend() {
  const label = BW.verifyPurpose === 'payment_info' ? 'set up your payment information' : 'submit your invoice';
  return `
  <div class="card bw-card">
    <div class="bw-icon">&#128231;</div>
    <h2>Verify Your Email</h2>
    <p>We'll send an 8-digit code to <strong>${esc(u.email)}</strong> to confirm it's really you before you ${esc(label)}.</p>
    <button class="btn btn-primary" id="bw-send-btn" onclick="BW.sendCode()">Send Code</button>
    <div style="margin-top:14px"><button class="btn btn-outline btn-sm" onclick="BW.cancelVerify()">Cancel</button></div>
  </div>`;
}

function viewVerifyCode() {
  return `
  <div class="card bw-card">
    <div class="bw-icon">&#128274;</div>
    <h2>Enter Your Code</h2>
    <p class="small-muted">We sent an 8-digit code to <strong>${esc(BW.sentTo)}</strong>. It expires in 10 minutes.</p>
    <div class="code-boxes" id="bw-code-boxes">
      ${Array.from({ length: 8 }).map((_, i) => `<input class="code-box" maxlength="1" inputmode="numeric" data-i="${i}">`).join('')}
    </div>
    <div id="bw-code-error" class="small-muted" style="color:var(--danger);min-height:18px"></div>
    <button class="btn btn-primary" id="bw-verify-btn" onclick="BW.confirmCode()">Verify</button>
    <div style="margin-top:14px">
      <button class="btn btn-outline btn-sm" onclick="BW.sendCode(true)">Resend Code</button>
      <button class="btn btn-outline btn-sm" onclick="BW.cancelVerify()">Cancel</button>
    </div>
  </div>`;
}

function viewPaymentForm() {
  const pi = BW.status.paymentInfo;
  return `
  <div class="card bw-card bw-wide">
    <h2 style="text-align:center">Payment Information</h2>
    <p class="small-muted" style="text-align:center">This is where we'll send your reimbursement payments. For security, bank details are always re-entered fresh — nothing sensitive is pre-filled.</p>
    <label>Bank</label>
    <div class="bank-picker">
      <div id="bank-selected-wrap"></div>
      <input id="pf-bank-search" placeholder="Search for your bank&hellip;" autocomplete="off" oninput="BW.filterBanks(this.value)" onfocus="BW.filterBanks(this.value)">
      <div id="bank-dropdown" class="bank-dropdown" style="display:none"></div>
    </div>
    <div id="pf-bank-manual-wrap" style="display:none">
      <label>Bank Name</label><input id="pf-bank-manual" placeholder="Enter your bank's name">
    </div>
    <label>Name on Account</label><input id="pf-name-on-account" value="${esc(pi?.name_on_account || '')}">
    <label>Address</label><input id="pf-address" value="${esc(pi?.address || '')}">
    <div class="bw-grid-3">
      <div><label>City</label><input id="pf-city" value="${esc(pi?.city || '')}"></div>
      <div><label>State</label><input id="pf-state" value="${esc(pi?.state || '')}"></div>
      <div><label>Zip</label><input id="pf-zip" value="${esc(pi?.zip || '')}"></div>
    </div>
    <div class="grid-2">
      <div><label>Contact Name</label><input id="pf-contact-name" value="${esc(pi?.contact_name || '')}"></div>
      <div><label>Contact Cell</label><input id="pf-contact-cell" type="tel" inputmode="tel" placeholder="(555) 555-5555" value="${esc(pi?.contact_cell || '')}" oninput="this.value = this.value.replace(/[^0-9+\-() ]/g, '')"></div>
    </div>
    <div class="grid-2">
      <div><label>Account Number ${pi ? `<span class="small-muted">(on file: &hellip;${esc(pi.account_last4)})</span>` : ''}</label><input id="pf-account" type="password" inputmode="numeric" autocomplete="off"></div>
      <div><label>Confirm Account Number</label><input id="pf-account-confirm" type="password" inputmode="numeric" autocomplete="off"></div>
    </div>
    <label>Routing Number ${pi ? `<span class="small-muted">(on file: &hellip;${esc(pi.routing_last4)})</span>` : ''}</label><input id="pf-routing" inputmode="numeric" maxlength="9" autocomplete="off">
    <div id="pf-error" class="small-muted" style="color:var(--danger);min-height:18px;margin-top:6px"></div>
    <div style="text-align:center;margin-top:10px">
      <button class="btn btn-primary" id="pf-save-btn" onclick="BW.savePaymentInfo()">Save Payment Information</button>
      ${BW.status.hasPaymentInfo ? `<div style="margin-top:12px"><button class="btn btn-outline btn-sm" onclick="BW.backToMain()">Cancel</button></div>` : ''}
    </div>
  </div>`;
}

function viewMain() {
  const pending = (BW.status.periods || []).filter(p => !p.submitted);
  const pi = BW.status.paymentInfo;
  // A store can only submit against a billing period it was actually
  // invited to and hasn't already submitted for — see routes/
  // storeBilling.js's POST /my/invoices. With none open, "Submit an
  // Invoice" has nothing to submit against, so it's not offered at all
  // rather than opening a form that can only fail server-side.
  return `
  <div class="flex-between"><h2 style="margin:0">Billing</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="BW.editPaymentInfo()">Update Payment Info</button>
      ${pending.length ? `<button class="btn btn-primary btn-sm" onclick="BW.startSubmitInvoice()">Submit an Invoice</button>` : ''}
    </div>
  </div>
  <p class="small-muted">To bill us back &mdash; for example, reimbursement for gift-card redemptions you've already honored &mdash; submit an invoice below.</p>
  ${pending.length ? `<div class="bw-period-banner">
    <div>${pending.length === 1 ? `Please submit your invoice for <strong>${esc(pending[0].label)}</strong>.` : `You have <strong>${pending.length} billing periods</strong> awaiting your invoice.`}</div>
    <button class="btn btn-primary btn-sm" onclick="BW.startSubmitInvoice()">Submit Now</button>
  </div>` : `<div class="card" style="font-size:13px;padding:12px 16px;margin-bottom:14px;color:var(--text-muted)">No open billing period right now &mdash; you'll get an email when it's time to submit an invoice.</div>`}
  <div class="card" style="font-size:13px;padding:12px 16px;margin-bottom:14px">
    On file: ${renderBankLogo(pi.bank_name, 22)} <strong>${esc(pi.bank_name)}</strong> &middot; account ending <strong>${esc(pi.account_last4)}</strong>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table><thead><tr><th>Submitted</th><th>Period</th><th>Amount</th><th>Description</th><th>Attachment</th><th>Status</th></tr></thead>
    <tbody>${BW.bills.length ? BW.bills.map(rowForBill).join('') : '<tr><td colspan="6" class="empty-state">No invoices submitted yet.</td></tr>'}</tbody></table>
  </div>`;
}

function rowForBill(b) {
  const cls = b.status === 'completed' ? 'active' : (b.status === 'rejected' ? 'rejected' : 'pending');
  let extra = '';
  if (b.status === 'completed') extra = `<div class="small-muted">Sent to ${esc(b.payment_bank_name || '')} &hellip;${esc(b.payment_account_last4 || '')} on ${fmtDate(b.payment_sent_date)}</div>`;
  if (b.status === 'rejected' && b.rejection_reason) extra = `<div class="small-muted">${esc(b.rejection_reason)}</div>`;
  return `<tr>
    <td>${fmtDateTime(b.submitted_at)}</td><td>${esc(b.period_label || b.period || '')}</td><td>${fmtMoney(b.amount)}</td><td>${esc(b.description || '')}</td>
    <td>${b.file_name ? `<a href="#" onclick="BW.downloadInvoice('${b.id}');return false;">${esc(b.file_name)}</a>` : '<span class="small-muted">&mdash;</span>'}</td>
    <td>${badge(b.status, cls)}${extra}</td>
  </tr>`;
}

function viewInvoiceForm() {
  // Always non-empty here — BW.startSubmitInvoice only ever navigates to
  // this view when there's at least one open period (see the NO_OPEN_PERIOD
  // guard there and server-side in POST /my/invoices).
  const unsubmitted = (BW.status.periods || []).filter(p => !p.submitted);
  const options = unsubmitted.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join('');
  return `
  <div class="card bw-card bw-wide">
    <h2 style="text-align:center">Submit an Invoice</h2>
    <div class="bw-tax-note">Please make your invoice out to <strong>${esc(BW.status.legalName || '(not yet set by admin)')}</strong>${BW.status.taxId ? ` &mdash; Tax ID <strong>${esc(BW.status.taxId)}</strong>` : ''}.</div>
    <label>Billing Period</label><select id="inv-period" onchange="BW.refreshPeriodLabel()">${options}</select>
    <label>Attachment <span class="req">*</span> <span class="small-muted">(image, PDF, Excel, or CSV)</span></label>
    <div class="bw-file-drop" id="inv-drop" onclick="qs('#inv-file').click()">
      <input id="inv-file" type="file" accept="image/*,application/pdf,.csv,.xls,.xlsx" onchange="BW.onFileChosen()">
      <div id="inv-drop-label">Click to choose a file, or drag one here</div>
      <div id="inv-file-name" class="bw-attachment-name"></div>
    </div>
    <label>Total Amount <span class="req">*</span></label>
    <input id="inv-amount" type="number" step="0.01" min="0.01" placeholder="0.00">
    <p class="small-muted">Reminder: we are tax-exempt &mdash; please don't include sales tax in your total.</p>
    <label>Description <span class="small-muted">(optional)</span></label>
    <textarea id="inv-description" rows="3" placeholder="What this invoice is for"></textarea>
    <div class="checkbox-row" style="margin-top:16px">
      <input type="checkbox" id="inv-confirm">
      <label style="margin:0">I confirm this invoice matches the billing period of <strong id="inv-period-label">${esc(unsubmitted[0]?.label || 'this submission')}</strong>.</label>
    </div>
    <div id="inv-error" class="small-muted" style="color:var(--danger);min-height:18px;margin-top:10px"></div>
    <div style="text-align:center;margin-top:10px">
      <button class="btn btn-primary" id="inv-submit-btn" onclick="BW.submitInvoice()">Submit Invoice</button>
      <div style="margin-top:12px"><button class="btn btn-outline btn-sm" onclick="BW.backToMain()">Cancel</button></div>
    </div>
  </div>`;
}

function viewInvoiceSuccess() {
  const b = BW.lastSubmitted;
  return `
  <div class="bw-success">
    <div class="bw-checkmark"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <h2>Invoice Received</h2>
    <p>Thanks &mdash; we've received your invoice for <strong>${esc(b.period || 'this submission')}</strong> totaling <strong>${fmtMoney(b.amount)}</strong>.</p>
    <p class="small-muted">A confirmation email is on its way to ${esc(u.email)}. We'll follow up once your payment is on its way.</p>
    <button class="btn btn-primary" onclick="BW.backToMain()">Back to Billing</button>
  </div>`;
}

// ===================== Actions =====================

BW.startVerify = (purpose) => {
  // An impersonating admin can't read the store's own inbox, so the server
  // already treats them as pre-verified (see /my/status's `impersonating`
  // flag and routes/storeBilling.js) — skip the code screens entirely and
  // land straight on whatever that purpose was leading to.
  if (BW.status.impersonating) { BW.view = purpose === 'payment_info' ? 'payment_form' : 'invoice_form'; render(); if (purpose === 'payment_info') wirePaymentForm(); return; }
  BW.verifyPurpose = purpose; BW.view = 'verify_send'; render();
};
BW.cancelVerify = () => { BW.view = BW.status.hasPaymentInfo ? 'main' : 'need_setup'; render(); };
BW.backToMain = async () => { BW.view = 'main'; await refreshStatus(); await loadBills(); render(); };

BW.sendCode = async (resend) => {
  const btn = qs('#bw-send-btn') || qs('.btn-outline');
  try {
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="bw-spinner"></span>Sending&hellip;'; }
    const r = await api('/store-billing/verify/start', { method: 'POST', body: { purpose: BW.verifyPurpose } });
    if (r.emailError) toast(r.emailError, true);
    BW.sentTo = r.sentTo;
    BW.view = 'verify_code';
    render();
    if (resend) toast('Code resent');
  } catch (err) { toast(err.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Send Code'; } }
};

function wireCodeBoxes() {
  const boxes = qsa('.code-box');
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/\D/g, '').slice(0, 1);
      if (box.value) { box.classList.add('filled'); if (boxes[i + 1]) boxes[i + 1].focus(); }
      else box.classList.remove('filled');
    });
    box.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !box.value && boxes[i - 1]) boxes[i - 1].focus(); });
    box.addEventListener('paste', (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 8).split('');
      digits.forEach((d, j) => { if (boxes[j]) { boxes[j].value = d; boxes[j].classList.add('filled'); } });
      (boxes[digits.length] || boxes[boxes.length - 1]).focus();
    });
  });
  if (boxes[0]) boxes[0].focus();
}

BW.confirmCode = async () => {
  const boxes = qsa('.code-box');
  const code = boxes.map(b => b.value).join('');
  if (code.length !== 8) { qs('#bw-code-error').textContent = 'Enter all 8 digits.'; return; }
  const btn = qs('#bw-verify-btn');
  try {
    btn.disabled = true; btn.innerHTML = '<span class="bw-spinner"></span>Verifying&hellip;';
    const r = await api('/store-billing/verify/confirm', { method: 'POST', body: { purpose: BW.verifyPurpose, code } });
    BW.verificationId = r.verificationId;
    // Verifying only UNLOCKS the next form — it never auto-submits it. For
    // invoice_submit this also marks the whole login session verified
    // server-side (see hasVerifiedThisSession in routes/storeBilling.js),
    // so the Submit button on the form that's about to show needs no
    // further verification step itself.
    if (BW.verifyPurpose === 'payment_info') { BW.view = 'payment_form'; render(); wirePaymentForm(); }
    else { BW.status.invoiceVerifiedThisSession = true; BW.view = 'invoice_form'; render(); }
  } catch (err) {
    qs('#bw-code-error').textContent = err.message;
    qs('#bw-code-boxes').classList.add('bw-shake');
    setTimeout(() => qs('#bw-code-boxes')?.classList.remove('bw-shake'), 400);
    btn.disabled = false; btn.textContent = 'Verify';
  }
};

BW.filterBanks = (q) => {
  const dropdown = qs('#bank-dropdown');
  const matches = US_BANKS.filter(b => b.toLowerCase().includes((q || '').toLowerCase())).slice(0, 40);
  dropdown.innerHTML = matches.map(b => `<div class="bank-item" onclick="BW.pickBank('${b.replace(/'/g, "\\'")}')">${renderBankLogo(b, 28)}<span>${esc(b)}</span></div>`).join('') || '<div class="bank-item" style="cursor:default">No matches</div>';
  dropdown.style.display = 'block';
};
BW.pickBank = (name) => {
  BW.selectedBank = name;
  qs('#bank-dropdown').style.display = 'none';
  qs('#pf-bank-search').style.display = 'none';
  qs('#bank-selected-wrap').innerHTML = `<div class="bank-selected-pill">${renderBankLogo(name, 30)}<strong>${esc(name)}</strong><button type="button" onclick="BW.clearBank()">&times;</button></div>`;
  qs('#pf-bank-manual-wrap').style.display = name === 'Other / Not Listed' ? 'block' : 'none';
};
BW.clearBank = () => {
  BW.selectedBank = null;
  qs('#bank-selected-wrap').innerHTML = '';
  qs('#pf-bank-search').style.display = 'block';
  qs('#pf-bank-search').value = '';
  qs('#pf-bank-manual-wrap').style.display = 'none';
};

function wirePaymentForm() {
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.bank-picker')) { const d = qs('#bank-dropdown'); if (d) d.style.display = 'none'; }
  });
  loadGoogleMaps().then(() => attachPlacesAutocomplete('pf-address', { address: 'pf-address', city: 'pf-city', state: 'pf-state', zip: 'pf-zip' }));
}

BW.savePaymentInfo = async () => {
  const bankName = BW.selectedBank === 'Other / Not Listed' ? qs('#pf-bank-manual').value.trim() : BW.selectedBank;
  const body = {
    verificationId: BW.verificationId,
    bank_name: bankName || '',
    name_on_account: qs('#pf-name-on-account').value.trim(),
    address: qs('#pf-address').value.trim(),
    city: qs('#pf-city').value.trim(),
    state: qs('#pf-state').value.trim(),
    zip: qs('#pf-zip').value.trim(),
    contact_name: qs('#pf-contact-name').value.trim(),
    contact_cell: qs('#pf-contact-cell').value.trim(),
    account_number: qs('#pf-account').value.trim(),
    account_number_confirm: qs('#pf-account-confirm').value.trim(),
    routing_number: qs('#pf-routing').value.trim(),
  };
  if (!body.bank_name) { qs('#pf-error').textContent = 'Please select or enter your bank.'; return; }
  if (body.contact_cell.replace(/\D/g, '').length < 10) { qs('#pf-error').textContent = 'Enter a valid phone number for Contact Cell (10 digits).'; return; }
  const btn = qs('#pf-save-btn');
  try {
    btn.disabled = true; btn.innerHTML = '<span class="bw-spinner"></span>Saving&hellip;';
    await api('/store-billing/payment-info', { method: 'POST', body });
    toast('Payment information saved');
    await refreshStatus();
    BW.view = 'main';
    await loadBills();
    render();
  } catch (err) {
    qs('#pf-error').textContent = err.message;
    btn.disabled = false; btn.textContent = 'Save Payment Information';
  }
};

BW.editPaymentInfo = () => BW.startVerify('payment_info');

BW.startSubmitInvoice = () => {
  // Defense in depth — the button that calls this is already hidden
  // whenever there's no open period (see viewMain), but never trust that
  // alone; the server enforces this too (NO_OPEN_PERIOD).
  if (!(BW.status.periods || []).some(p => !p.submitted)) { toast('There is no open billing period to submit against right now.', true); return; }
  if (BW.status.invoiceVerifiedThisSession) { BW.view = 'invoice_form'; render(); }
  else BW.startVerify('invoice_submit');
};

function wireInvoiceForm() {
  const drop = qs('#inv-drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('drag');
    if (e.dataTransfer.files[0]) { qs('#inv-file').files = e.dataTransfer.files; BW.onFileChosen(); }
  });
}
BW.onFileChosen = () => {
  const f = qs('#inv-file').files[0];
  qs('#inv-file-name').textContent = f ? f.name : '';
  qs('#inv-drop-label').textContent = f ? 'Change file' : 'Click to choose a file, or drag one here';
};
BW.refreshPeriodLabel = () => {
  const sel = qs('#inv-period');
  const opt = sel && sel.options[sel.selectedIndex];
  qs('#inv-period-label').textContent = opt ? opt.textContent : 'this submission';
};

// Only ever reachable after BW.startSubmitInvoice has confirmed the login
// session is verified (either it already was, or the user just completed
// the verify-code screen) — so there's no verification branch to handle
// here, just the plain submit.
BW.submitInvoice = async () => {
  const amount = +qs('#inv-amount').value;
  if (!amount || amount <= 0) { qs('#inv-error').textContent = 'Enter a valid amount.'; return; }
  if (!qs('#inv-file').files[0]) { qs('#inv-error').textContent = 'Please attach your invoice.'; return; }
  if (!qs('#inv-confirm').checked) { qs('#inv-error').textContent = 'Please confirm the billing period checkbox.'; return; }
  const btn = qs('#inv-submit-btn');
  const fd = new FormData();
  const periodSel = qs('#inv-period');
  if (periodSel && periodSel.value) fd.append('billing_period_id', periodSel.value);
  fd.append('amount', qs('#inv-amount').value);
  fd.append('description', qs('#inv-description').value);
  fd.append('period_confirmed', '1');
  fd.append('file', qs('#inv-file').files[0]);
  try {
    btn.disabled = true; btn.innerHTML = '<span class="bw-spinner"></span>Submitting&hellip;';
    const r = await api('/store-billing/my/invoices', { method: 'POST', isForm: true, body: fd });
    BW.lastSubmitted = r.bill;
    BW.view = 'invoice_success';
    render();
  } catch (err) {
    qs('#inv-error').textContent = err.message;
    btn.disabled = false; btn.textContent = 'Submit Invoice';
  }
};

BW.downloadInvoice = async (id) => {
  try { await downloadAuthed(`/store-billing/my/invoices/${id}/file`, 'invoice'); } catch (err) { toast(err.message, true); }
};

// Attach code-box wiring whenever the verify_code view paints.
const _render = render;
render = function () { _render(); if (BW.view === 'verify_code') wireCodeBoxes(); if (BW.view === 'invoice_form') wireInvoiceForm(); };

boot();
</script>
</body>
</html>
